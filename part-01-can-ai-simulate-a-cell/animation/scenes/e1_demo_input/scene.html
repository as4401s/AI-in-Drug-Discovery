<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/wb.css"></head>
<body><div id="canvas"></div>
<script src="../../lib/wb.js"></script><script src="../../lib/codecard.js"></script>
<script>
SCENE_INIT({ep:1,part:4,partTitle:'The real ESM-2 experiment',title:'Start the real notebook with real data',foot:'Reference sequences · UniProt P00533 / P11716 · release 2026_04 · Actual local ESM-2 t6_8M run · frozen checkpoint · short sequence windows'},(S,C)=>{
const {el,at,show,out,mix,svg,lin}=WB;const K=C;const INK='#183b32',MUT='#60716a';
function box(cls,x,y,w,h){const b=el('div','box '+cls);at(b,x,y,w,h);return b}
function tx(css,html,x,y,w){const e=el('div','t');e.style.cssText+=';'+css;e.innerHTML=html;at(e,x,y,w);return e}
const code=CODECARD(S,{x:1210,y:222,w:630,h:560,title:'esm2_demo.py · select_window',sub:'real source lines 61–66',lines:K.code,fs:20,lh:30,cpl:46,measure:true});
// ---- protein bar
const BX=100,BW=1060,BY=300,N=1210,px=n=>BX+(n-1)*BW/(N-1);
const bTitle=tx('font:600 30px/1 Inter;color:'+INK,'EGFR · UniProt P00533 · 1,210 amino acids',BX,238);
const bar=box('',BX,BY,BW,44);bar.style.cssText+=';background:linear-gradient(90deg,#9fb9d9,#7fa4cf);border-radius:10px';
const t1=tx('font:500 24px/1 Inter;color:'+MUT,'1',BX,BY+54),t2=tx('font:500 24px/1 Inter;color:'+MUT+';text-align:right;width:120px','1,210',BX+BW-120,BY+54);
const pin=box('',px(797)-3,BY-48,6,48+44);pin.style.background='#b76d66';
const pinL=tx('font:700 30px/1 Poppins;color:#a65647;width:340px','position 797',px(797)+12,BY-62);
const ok=el('div','pill b-mint','C = cysteine · matches the expected residue ✓');at(ok,px(797)-440,BY+66);ok.style.cssText+=';font-size:27px;padding:8px 22px;font-weight:600;border:3px solid #4d8f7e;z-index:6';
// ---- window band + zoom
const bandX=px(767),bandW=px(827)-px(767);
const band=box('',bandX,BY-6,bandW,56);band.style.cssText+=';border:5px solid #b76d66;border-radius:8px;background:rgba(183,109,102,.18)';
const sv=svg('svg',{width:1920,height:1080,style:'position:absolute;left:0;top:0'},S);
const trap=svg('path',{d:`M${bandX} ${BY+50} L${BX} 470 L${BX+31*34} 470 L${bandX+bandW} ${BY+50} Z`,fill:'rgba(183,109,102,.10)',stroke:'#b76d66','stroke-width':3,'stroke-dasharray':'8 8'},sv);
const seq=K.seq;const CW=34;
const cells=[...seq].map((a,i)=>{const row=i<31?0:1,col=i<31?i:i-31;const isC=i==30;const c=box(isC?'b-coral':'b-blue',BX+col*CW,478+row*56,CW-3,50);c.style.cssText+=`;border-radius:8px;font:700 24px/50px Poppins;text-align:center;color:${INK}`+(isC?';border:4px solid #b76d66':'');c.textContent=a;return c});
const wl1=tx('font:600 24px/1 Inter;color:'+MUT,'767',BX,478+112+6),wl2=tx('font:600 24px/1 Inter;color:#a65647;text-align:center;width:60px','797',BX+30*CW-13,478+56+2-4);wl2.style.display='none';
const wl3=tx('font:600 24px/1 Inter;color:'+MUT,'827',BX+30*CW-20,478+112+6);
const wcap=tx('font:600 28px/1.25 Inter;color:'+INK,'The window: 61 amino acids, positions 767–827',BX,636);
const chip=el('div','pill b-lav','small + fast on a CPU');at(chip,BX+730,630);chip.style.cssText+=';font-size:27px;padding:8px 24px;font-weight:600';
const ctx=el('div','pill b-amber','Less context than the full protein, so the window is recorded: <b>767–827</b>');at(ctx,BX,690);ctx.style.cssText+=';font-size:28px;padding:12px 28px;text-align:left';
const yes=box('b-mint',100,780,520,190);const yesT=tx('font:700 30px/1 Poppins;color:'+INK,'These results describe',128,800);const yesB=tx('font:400 29px/1.35 Inter;color:'+INK,'✓ ESM-2 t6_8M<br>✓ this 61-amino-acid window',128,852);
const no=box('b-coral',660,780,500,190);const noT=tx('font:700 30px/1 Poppins;color:'+INK,'They are not scores for',688,800);const noB=tx('font:400 29px/1.35 Inter;color:#a65647','✕ the full protein<br>✕ a larger checkpoint',688,852);
// plain-English notes next to code
const notes=[['1','Load the reference sequence from UniProt',K.c_load,K.c_ver-.3],['2','Check position 797 really is C',K.c_ver,K.c_win-.3],['3','Cut out a short window around it',K.c_win,K.c_ctx-.3],['4','Record the window so results stay honest',K.c_ctx,K.c_ours-.3],['5','These results describe <b>this model and this window</b> only.',K.c_ours,K.c_not-.3],['6','They say nothing about the full protein or about bigger ESM-2 models.',K.c_not,999]];
const nBox=box('b-amber',1210,800,630,160);
const nt=notes.map(([n,s,a,b],i)=>{const e=el('div','t',s);e.style.cssText+=';font:600 27px/1.25 Inter;color:'+INK+';white-space:normal';at(e,1230,800+0,580);return {e,a,b}});
return function update(t){
  code.update(t,out(t,K.c_ver-.5,.7));
  show(bTitle,t,K.c_load,.6);show(bar,t,K.c_load+.2,.8,{dy:0});show(t1,t,K.c_load+.6,.5);show(t2,t,K.c_load+.6,.5);
  show(pin,t,K.c_pos-1.5,.6,{dy:-20});show(pinL,t,K.c_pos-1.2,.6);show(ok,t,K.c_pos,.6);
  show(band,t,K.c_win,.6,{dy:0});sv.style.opacity=out(t,K.c_win+.2,.8);
  cells.forEach((c,i)=>show(c,t,K.c_win+.6+i*.02,.4,{dy:6}));
  show(wl1,t,K.c_win+1.4,.5);show(wl3,t,K.c_win+1.4,.5);show(wcap,t,K.c_win+1.6,.6);
  show(chip,t,K.c_small,.6);show(ctx,t,K.c_ctx,.6);
  [yes,yesT,yesB].forEach(e=>show(e,t,K.c_ours-.2,.6));[no,noT,noB].forEach(e=>show(e,t,K.c_not-.2,.6));
  // plain English note (one at a time)
  show(nBox,t,K.c_load-.2,.6);
  nt.forEach((n,i)=>{const a=out(t,n.a-.1,.4)*(1-out(t,n.b,.4));n.e.style.opacity=a;n.e.style.transform=`translateY(${((1-a)*8).toFixed(1)}px)`;n.e.style.top=(822)+'px'});
  nt.forEach((n,i)=>{});
  return 0;
};
});
</script></body></html>
