SCENE_INIT({ep:1,part:4,partTitle:'The real ESM-2 experiment',title:'From letters to model tensors',foot:'Actual local ESM-2 t6_8M run · frozen checkpoint · short sequence windows · source SHA-256 recorded with the run'},(S,C)=>{
const {el,at,show,out,mix,svg,lin}=WB;const K=C;const INK='#183b32',MUT='#60716a';

 ['61 amino acids + 2 special tokens = <b>63</b> token positions.',K.c_count-.2,K.c_320-.3],['Each position is described by <b>320 numbers</b>.',K.c_320-.2,K.c_tensor-.3],
 ['Those numbers are stored in a <b>tensor</b>: an array with one or more dimensions.',K.c_tensor-.2,K.c_d1-.3],['Three dimensions: sequences · positions · features.',K.c_d1-.2,K.c_rm-.3],

{const g=cv.getContext('2d');const r=mb(21);const base=[];for(let y=0;y<63;y++){base.push([]);for(let x=0;x<320;x++){const v=Math.sin(x/17+y/9)*.35+Math.sin(x/5.3-y/3.1)*.25+(r()-.5)*.7;base[y].push(v)}}
 for(let y=0;y<63;y++)for(let x=0;x<320;x++){let v=base[y][x];let col;if(y==0||y==62){col=[240,190,184]}else{const tt=Math.min(1,Math.abs(v)/.9);const c=v<0?[150,190,235]:[240,170,163];col=c.map(q=>Math.round(255+(q-255)*(.15+.8*tt)))}g.fillStyle=`rgb(${col})`;g.fillRect(x,y,1,1)}}

const sh=r3(tx('font:700 52px/1 "DejaVu Sans Mono",monospace;color:'+INK,'<span style="color:#8b75b0">1</span>, <span style="color:#557eaf">63</span>, <span style="color:#26765d">320</span>',BX,BY-132));const shL=r3(tx('font:700 52px/1 "DejaVu Sans Mono",monospace;color:'+INK,'[',BX-34,BY-134));const shR=r3(tx('font:700 52px/1 "DejaVu Sans Mono",monospace;color:'+INK,']',BX+346,BY-134));

const g1l=r4(tx('font:600 26px/1.2 Inter;color:'+INK,'1 dimension<br><span style="font-weight:400;color:'+MUT+'">a list</span>',gx+150,310,170));

const g3=r4(box('',gx,668,90,90));g3.style.cssText+=';background:#c9e5da;border:3px solid #26765d;border-radius:6px;box-sizing:border-box';
const g3l=r4(tx('font:600 26px/1.2 Inter;color:'+INK,'3 dimensions<br><span style="font-weight:400;color:'+MUT+'">a block</span>',gx+150,672,170));
// removal + result
const P5=[];const r5=e=>{P5.push(e);return e};

const RH=BH/63;

const stB=r5(box('',BX,BY+BH-RH-2,BW,RH+2));stB.style.cssText+=';border:3px solid #b76d66;box-sizing:border-box;border-radius:3px';
const cT=r5(box('',BX+BW+6,BY+RH/2+10,44,3));cT.style.cssText+=';background:#b76d66';
const cB=r5(box('',BX+BW+6,BY+BH-RH/2-12,44,3));cB.style.cssText+=';background:#b76d66';
const wT=r5(box('',BX,BY,BW,RH+2));wT.style.cssText+=';background:#fff;border:3px dashed #b76d66;box-sizing:border-box;border-radius:3px';
const wB=r5(box('',BX,BY+BH-RH-2,BW,RH+2));wB.style.cssText+=';background:#fff;border:3px dashed #b76d66;box-sizing:border-box;border-radius:3px';
return function update(t){
  code.update(t,out(t,K.c_tok,.7));
  show(nBox,t,K.c_tok-.2,.6);nts.forEach(n=>{const a=out(t,n.a,.4)*(1-out(t,n.b,.4));n.e.style.opacity=a;n.e.style.transform=`translateY(${((1-a)*8).toFixed(1)}px)`});

  P1.forEach(e=>{e.style.opacity=parseFloat(e.style.opacity||0)*f1});

  numC.forEach((c,i)=>show(c,t,K.c_320+.2+i*.05,.4,{dy:6}));show(dots2,t,K.c_320+.8,.5);show(br320,t,K.c_320+.9,.5,{dy:0});show(n320,t,K.c_320+1.0,.6);show(n320s,t,K.c_320+1.2,.5);
  [one,oneL,arr,dots2,br320,n320,n320s,NC].concat(numC).forEach(e=>{e.style.opacity=parseFloat(e.style.opacity||0)*f2});

  show(dnote,t,K.c_tensor+.6,.6);show(dimD,t,K.c_d1,.6);show(arD,t,K.c_d1,.5,{dy:0});show(dimP,t,K.c_d2,.6);show(dimPn,t,K.c_d2,.6);show(arP,t,K.c_d2,.5,{dy:0});show(dimF,t,K.c_d3,.6);show(arF,t,K.c_d3,.5,{dy:0});
