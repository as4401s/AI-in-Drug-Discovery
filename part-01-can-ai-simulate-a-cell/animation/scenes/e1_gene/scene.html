<script>
SCENE_INIT({ep:1,part:1,partTitle:'Biology foundations',title:'A gene is a usable region of DNA',foot:'Biology foundations · schematic illustrations · simplified · National Human Genome Research Institute concepts'},(S,C)=>{

const notes=NOTES({x:X0,y:226,w:1160,h:178,tfs:30,bfs:28,notes:nk.map((n,i)=>({a:c(n[0]),b:i<nk.length-1?c(nk[i+1][0])-.1:null,title:n[1],body:n[2]}))});

const bar=box('',760,520,1060,44);bar.style.cssText+=';background:#eaf3ef;border:3px solid #8aa59b;border-radius:22px;transform-origin:left center;opacity:0';
const g1=box('',1000,516,360,52);g1.style.cssText+=';background:rgba(224,164,58,.35);border:4px solid #e0a43a;border-radius:16px;opacity:0';
const g2=box('',1500,516,240,52);g2.style.cssText+=';background:rgba(139,117,176,.3);border:4px solid #8b75b0;border-radius:16px;opacity:0';
const dl=ctx('font:600 26px Inter;color:'+MUT,'DNA',810,478,120);

const sv=svgLayer(S);arrowDefs(sv,'ag',GRN);arrowDefs(sv,'ap',COR);
const a1=WB.svg('path',{d:'M1180 574 L 1180 640',stroke:GRN,'stroke-width':9,fill:'none','stroke-linecap':'round','marker-end':'url(#ag)'},sv);
const a2=WB.svg('path',{d:'M1620 574 L 1620 640',stroke:'#8b75b0','stroke-width':9,fill:'none','stroke-linecap':'round'},sv);
const P1=box('b-mint',900,650,560,270),P2=box('b-lav',1500,650,340,270);
const qm=ctx('font:700 150px/1 Poppins;color:#4d8f7e',' ?',1180,710,200);
const prot=ico('folded-protein',1180,800,240);
const pt1=ctx('font:700 34px/1.1 Poppins;color:'+INK,'a functional product',1180,666,520),pt1b=ctx('font:700 34px/1.1 Poppins;color:'+INK,'protein',1180,666,520);
const rna=ico('rna-strand',1670,800,220);const pt2=ctx('font:700 34px/1.1 Poppins;color:'+INK,'functional RNA',1670,666,300);
const ne=chip('gene ≠ only “protein”',1280,960,'coral',{fs:32});
const hl1=box('',1140,640,80,6);hl1.style.cssText+=';opacity:0';
// ---- books (analogy) ----

const bookCols=[PAL.blue,PAL.coral,PAL.mint,PAL.amber,PAL.lav,PAL.blue,PAL.mint,PAL.coral];
const books=bookCols.map((P,i)=>{const h=215+((i*37)%5)*14;const b=box('',820+i*118,860-h,88,h);b.style.cssText+=`;background:${P[0]};border:4px solid ${P[1]};border-radius:10px 10px 4px 4px;opacity:0`;b._h=h;b._x=820+i*118;
  const bar1=document.createElement('div');bar1.style.cssText=`position:absolute;left:12px;right:12px;top:34px;height:8px;background:${P[1]};opacity:.55;border-radius:4px`;const bar2=bar1.cloneNode();bar2.style.top='56px';bar2.style.opacity='.35';b.appendChild(bar1);b.appendChild(bar2);return b});
const bc1=chip('a reference collection',1280,455,'amber',{fs:32});
const bcx=chip('✗  a cell does not consciously read a book',1280,925,'coral',{fs:30});
const sel=[0,3,6];const sc=[chip('which',0,0,'mint',{fs:28}),chip('where',0,0,'blue',{fs:28}),chip('how much',0,0,'lav',{fs:28})];
const mt=box('',books[6]._x-4,900,96,22);mt.style.cssText+=';background:#fff;border:4px solid #8b75b0;border-radius:11px;opacity:0';const mf=box('',books[6]._x-4,900,40,22);mf.style.cssText+=';background:#8b75b0;border-radius:11px;opacity:0';

const OX=[740,1118,1496],OW=350;
const oc=[['b-coral','the product changes'],['b-mint','its regulation changes'],['b-blue','no important effect here']].map(([cls,tt],i)=>({bx:box(cls,OX[i],560,OW,320),tt:ctx('font:700 30px/1.15 Poppins;color:'+INK,tt,OX[i]+OW/2,790,OW-24)}));

const sl=box('',OX[1]+40,690,OW-80,22);sl.style.cssText+=';background:#fff;border-radius:11px;border:4px solid #4d8f7e;opacity:0';const kn=box('',OX[1]+40,678,46,46);kn.style.cssText+=';background:#4d8f7e;border-radius:50%;border:5px solid #fff;opacity:0';
const bA=box('',OX[2]+70,630,90,110),bB=box('',OX[2]+190,630,90,110);[bA,bB].forEach(b=>b.style.cssText+=';background:#7f9fc9;border-radius:10px;opacity:0');const bt1=ctx('font:600 24px Inter;color:'+MUT,'before',OX[2]+115,752,120),bt2=ctx('font:600 24px Inter;color:'+MUT,'after',OX[2]+235,752,120);
const ar=[0,1,2].map(i=>WB.svg('path',{d:`M1280 512 L ${OX[i]+OW/2} 556`,stroke:COR,'stroke-width':6,fill:'none','stroke-linecap':'round','stroke-dasharray':'3 12'},sv));
const qb=[0,1,2].map(i=>ctx('font:700 64px/1 Poppins;color:'+COR,'?',OX[i]+OW-40,566,60));
const ev=chip('we need evidence to tell them apart',1280,925,'amber',{fs:32});
const wp=ico('well-plate',1700,300,0);

const nd=ico('dna-helix',1000,720,190),nr=ico('rna-strand',1560,720,250);
const nl1=chip('a gene in DNA',1000,900,'blue',{fs:30}),nl2=chip('next · RNA',1560,900,'lav',{fs:34});
const na=WB.svg('path',{d:'M1130 720 L 1400 720',stroke:'#8b75b0','stroke-width':9,fill:'none','stroke-linecap':'round','marker-end':'url(#ag)'},sv);const nd1=WB.svg('circle',{r:12,fill:COR},sv);
return function update(t){
  const A=k=>c(k);
  const g=out(t,A('c_gene')-.5,1.6);hx.draw({phase:track(t*1.1),grow:g,op:1});
  notes.update(t);
  const gA=out(t,A('c_gene')+.2,.6);gbox.style.opacity=gA;gbox.style.transform=`scale(${(.92+.08*gA+track(Math.sin(t*3)*.012)*gA).toFixed(3)})`;life(gnc,t,A('c_gene')+.5,null);
  // DNA bar stage
  const stageEnd=A('c_analogy')-.3;
  const bi=out(t,A('c_gene')+.1,1.0)*(1-out(t,stageEnd,.4));bar.style.opacity=bi;bar.style.transform=`scaleX(${out(t,A('c_gene')+.1,1.0).toFixed(3)})`;
  life(dl,t,A('c_gene')+.6,stageEnd);
  life(g1,t,A('c_gene')+1.0,stageEnd,{dy:0});life(c1,t,A('c_gene')+1.2,stageEnd,{dy:8});
  pathGrow(a1,out(t,A('c_gene')+2.2,.7));a1.style.opacity=win(t,A('c_gene')+2.2,stageEnd,.1);
  life(P1,t,A('c_gene')+2.8,stageEnd,{dy:20});
  // product title & ? -> protein
  const toProt=out(t,A('c_prot')+.2,.5);
  qm.style.opacity=win(t,A('c_gene')+3.0,stageEnd)*(1-toProt);qm.style.transform=`scale(${(1+track(Math.sin(t*4)*.04)).toFixed(3)})`;
  pt1.style.opacity=win(t,A('c_gene')+3.0,stageEnd)*(1-toProt);pt1b.style.opacity=win(t,A('c_prot')+.2,stageEnd);
  prot.set({op:win(t,A('c_prot')+.3,stageEnd,.6),s:.7+.3*out(t,A('c_prot')+.3,.7),y:track(Math.sin(t*1.6)*6)});
  // second gene
  life(g2,t,A('c_rna')-.2,stageEnd,{dy:0});life(c2,t,A('c_rna')-.1,stageEnd,{dy:8});
  pathGrow(a2,out(t,A('c_rna')+.6,.7));a2.style.opacity=win(t,A('c_rna')+.6,stageEnd,.1);
  life(P2,t,A('c_rna')+1.2,stageEnd,{dy:20});life(pt2,t,A('c_rna')+1.4,stageEnd,{dy:8});
  rna.set({op:win(t,A('c_rna')+1.5,stageEnd,.6),s:.7+.3*out(t,A('c_rna')+1.5,.7),y:track(Math.sin(t*1.6+1)*6)});
  life(ne,t,A('c_not')+.2,stageEnd,{dy:8});
  // books
  const bs=A('c_analogy')-.1,be=A('c_chg')-.3;
  life(shelf,t,bs,be,{dy:0});life(bc1,t,bs+.3,be,{dy:8});
  books.forEach((b,i)=>{const pin=out(t,bs+.3+.12*i,.5);const isSel=sel.indexOf(i);let lift=0;if(isSel>=0){lift=-46*out(t,A('c_reg')+.5+ (isSel==0?0:isSel==1?(A('c_where')-A('c_reg')-.5):(A('c_much')-A('c_reg')-.5)),.5)}
    b.style.opacity=pin*(1-out(t,be,.4));b.style.transform=`translateY(${((1-pin)*-60+lift).toFixed(1)}px)`});
  life(bcx,t,A('c_cell')+.1,A('c_reg')-.3,{dy:8});
  const stimes=[A('c_which'),A('c_where'),A('c_much')];
  sc.forEach((e,i)=>{const bk=books[sel[i]];e.style.left=(bk._x+44-e._w/2)+'px';e.style.top=(860-bk._h-80)+'px';life(e,t,stimes[i]+.1,be,{dy:8})});
  mt.style.opacity=win(t,A('c_much')+.3,be);mf.style.opacity=win(t,A('c_much')+.3,be);mf.style.width=(14+70*(.5+.5*track(Math.sin((t-A('c_much'))*2.2))))+'px';
  // outcomes
  const os=A('c_chg')-.1,oe=A('c_next')-.3;const ot=[A('c_aprod'),A('c_areg'),A('c_noeff')];
  life(ch,t,os,oe,{dy:8});
  oc.forEach((o,i)=>{life(o.bx,t,ot[i]-.2,oe,{dy:20});life(o.tt,t,ot[i]+.1,oe,{dy:8});pathGrow(ar[i],out(t,ot[i]-.3,.6));ar[i].style.opacity=win(t,ot[i]-.3,oe,.1)});
  pm.set({op:win(t,ot[0]+.2,oe,.5),s:.8+.2*out(t,ot[0]+.2,.6),y:track(Math.sin(t*1.7)*5)});

  [bA,bB,bt1,bt2].forEach(e=>life(e,t,ot[2]+.1,oe,{dy:0}));
  const sw=.5+.5*track(Math.sin(t*2.2));bA.style.height='110px';bB.style.height=(110)+'px';
  qb.forEach((q,i)=>{q.style.opacity=win(t,A('c_evid')+.15*i,oe)*(.6+.4*track(Math.sin(t*5+i)*.5+.5))});
  life(ev,t,A('c_evid')+.3,oe,{dy:8});
  // next
  const ns=A('c_next');
  nd.set({op:win(t,ns,9999,.6),s:.85+.15*out(t,ns,.7),y:track(Math.sin(t*1.4)*4)});nr.set({op:win(t,ns+1.4,9999,.6),s:.85+.15*out(t,ns+1.4,.7),y:track(Math.sin(t*1.4+1)*4)});
  pathGrow(na,out(t,ns+.8,.7));na.style.opacity=win(t,ns+.8,9999,.1);
  const dp=track(((t-ns-1.6)*.45)%1);nd1.setAttribute('cx',1130+270*dp);nd1.setAttribute('cy',720);nd1.style.opacity=out(t,ns+1.6,.4)*Math.sin(Math.PI*dp);
  life(nl1,t,ns+.3,null,{dy:8});life(nl2,t,ns+2.0,null,{dy:8});
};});
</script></body></html>
