<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/wb.css"></head>

<script src="../../lib/wb.js"></script><script src="../../assets3/icons.js"></script><script src="../../lib/bio.js"></script>
<script>
SCENE_INIT({ep:1,part:1,partTitle:'Biology foundations',title:'RNA · working messages and other roles',foot:'Biology foundations · schematic illustrations · expression bars are illustrative, not measured data · National Human Genome Research Institute concepts'},(S,C)=>{

const lg1=chip('condition 1',1500,470,'blue',{fs:26}),lg2=chip('condition 2',1700,470,'coral',{fs:26});

const nmr=ico('capped-polyadenylated-mrna',1000,720,260),nrb=ico('ribosome',1560,720,290);
const na=WB.svg('path',{d:'M1180 720 L 1380 720',stroke:'#8b75b0','stroke-width':9,fill:'none','stroke-linecap':'round','marker-end':'url(#arp)'},svB);const nd1=WB.svg('circle',{r:12,fill:COR},svB);
const nl1=chip('messenger RNA',1000,900,'lav',{fs:30}),nl2=chip('next · protein building',1560,900,'mint',{fs:32});
return function update(t){
  const A=k=>c(k);
  lrna.set({op:out(t,A('c_rna'),.9),s:.9+.1*out(t,A('c_rna'),.9),y:track(Math.sin(t*1.3)*8),r:track(Math.sin(t*.9)*2.5)});life(lc,t,A('c_rna')+.4,null);
  notes.update(t);
  // beads -> letters
  const e1=A('c_transc')-.3;
  const bk=out(t,A('c_rna')+.2,2.4);pathGrow(back,bk);back.style.opacity=bk*(1-out(t,e1,.4));
  beads.forEach((b,i)=>{const pin=out(t,A('c_rna')+.3+.28*i,.4);const tr=out(t,A('c_single')+.1+.12*i,.35);b.style.opacity=pin*(1-tr)*(1-out(t,e1,.4));b.style.transform=`scale(${(.4+.6*pin).toFixed(3)})`});
  letters.forEach((e,i)=>{const p=out(t,A('c_single')+.15+.2*i,.4);e.style.opacity=p*(1-out(t,e1,.4));e.style.transform=`scale(${(.6+.4*p).toFixed(3)})`});
  life(b1,t,A('c_rna')+1.2,A('c_single')-.2,{dy:8});life(b2,t,A('c_single')+.5,e1,{dy:8});
  life(uc,t,A('c_u')+.8,e1,{dy:8});const ulp=out(t,A('c_u')+.8,.5)*(1-out(t,e1,.4));ul.style.opacity=ulp;
  // transcription
  const ts=A('c_transc'),te=A('c_mrna')-.3,tEnd=ts+.5+6.1;
  const prog=lin(t,ts+.7,6.0);
  dnaTop.forEach((e,i)=>{const p=out(t,ts-.1+.08*i,.4);e.style.opacity=p*(1-out(t,te,.4));e.style.transform=`translateY(${((1-p)*-30).toFixed(1)}px)`});
  dnaBot.forEach((e,i)=>{const p=out(t,ts+.1+.08*i,.4);e.style.opacity=p*(1-out(t,te,.4));e.style.transform=`translateY(${((1-p)*30).toFixed(1)}px)`});
  rungs.forEach((r,i)=>{r.style.opacity=out(t,ts+.3+.08*i,.4)*(1-out(t,te,.4))});
  [dnaL,dnaL2].forEach(e=>life(e,t,ts+.4,te,{dy:6}));life(rnaL,t,ts+1.2,te,{dy:6});
  const px=TX(0)+TW/2+prog*7*128;pol.set({op:win(t,ts+.3,A('c_notused')+1.2,.5),x:px-(TX(0)+TW/2),y:track(Math.sin(t*5)*4)+(1-out(t,ts+.3,.5))*-30,s:1});
  rnaRow.forEach((e,i)=>{const at=ts+.7+(i+.4)*(6.0/7);const p=out(t,at,.35);e.style.opacity=p*(1-out(t,te,.4));e.style.transform=`translateY(${((1-p)*-40).toFixed(1)}px) scale(${(.6+.4*p).toFixed(3)})`;const l=conn[i];l.style.opacity=p*(1-out(t,te,.4))});
  life(tcl,t,ts+.8,A('c_notused')-.2,{dy:8});
  keep.style.opacity=win(t,A('c_notused'),te,.5);life(kc,t,A('c_notused')+.3,te,{dy:8});
  // mRNA story
  const ms=A('c_mrna'),me=A('c_nuc')-.3;
  gdna.set({op:win(t,ms,me,.5),s:.9+.1*out(t,ms,.5),y:track(Math.sin(t*1.4)*4)});life(gl,t,ms+.2,me,{dy:8});
  const mp=out(t,ms+.8,2.4);mpath.setAttribute('stroke-dasharray',1000);mpath.setAttribute('stroke-dashoffset',1000*(1-mp)*(mpath.getTotalLength()/1000));mpath.style.opacity=win(t,ms+.8,me,.1);
  mhead.style.opacity=win(t,ms+3.0,me,.3);life(mc,t,ms+1.0,me,{dy:8});
  mrib.set({op:win(t,ms+3.0,me,.6),s:.8+.2*out(t,ms+3.0,.7),y:track(Math.sin(t*1.5)*5)});life(rc,t,ms+3.3,me,{dy:8});
  mdots.forEach((d,i)=>{const q=track(((t-ms-1.4)*.32+i/3)%1);d.setAttribute('cx',960+600*q);d.setAttribute('cy',700+Math.sin((q*600)/10*.5)*26);d.style.opacity=out(t,ms+1.4,.4)*Math.sin(Math.PI*q)*win(t,ms,me,.1)});

  const ns=A('c_nuc'),ne=A('c_other')-.3;
  cell.set({op:win(t,ns-.2,ne,.6),s:.9+.1*out(t,ns-.2,.7),y:track(Math.sin(t*1.4)*4)});

  const move=out(t,A('c_leave')-.3,2.6);const tp=trail.getPointAtLength(trail.getTotalLength()*move);

  tok1.set({op:win(t,ns+.8,A('c_proc')+.4,.4)*(1-pr),x:tp.x-nuc[0],y:tp.y-nuc[1]});

  // other RNAs

  bars.forEach(b=>{const a=A('c_abund')+.2+b._i*.28+b._k*.9;const g=out(t,a,.7);const wob=1+.03*track(Math.sin(t*2.2+b._i*1.3+b._k)*1)*g;b.style.opacity=g*(1-out(t,me2,.4));b.style.transform=`scaleY(${(g*wob).toFixed(3)})`});

  life(nl1,t,nx+.3,null,{dy:8});life(nl2,t,nx+2.0,null,{dy:8});
};});
</script></body></html>
