<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/wb.css"></head>
<body><div id="canvas"></div>
<script src="../../lib/wb.js"></script><script src="../../assets3/icons.js"></script><script src="../../lib/bio.js"></script>
<script>
SCENE_INIT({ep:1,part:0,partTitle:'Introduction and contents',title:'Can AI simulate a cell?',foot:'WhiskerBrief teaching example · schematic illustrations, not measured data'},(S,C)=>{
const {out,ramp,lin,mix,track}=WB;const c=k=>C[k];
const sv=svgLayer(S);arrowDefs(sv,'ar1',GRN);
// ---- act 1: a candidate medicine meets a living cell
const mol=ico('small-molecule',400,575,480);const molC=chip('A candidate medicine',400,742,'blue',{fs:30});
const cell=ico('animal-cell',1270,560,520);
const aPath=WB.svg('path',{d:'M660 575 L930 575',stroke:GRN,'stroke-width':7,fill:'none','stroke-dasharray':'2 0','marker-end':'url(#ar1)','stroke-linecap':'round'},sv);
const cellC=chip('A living human cell',1270,860,'mint',{fs:30});
const qs=[[1000,370,86],[1580,380,70],[1560,740,64]].map(([x,y,s])=>ctx(`font:700 ${s}px/1 Poppins;color:${COR}`,'?',x,y-s/2,100));
const rec=ico('membrane-receptor',1512,455,120);const recC=chip('the protein you care about',1640,330,'mint',{fs:26});

const ban=box('b-amber',80,924,1760,50);const banT=tx('font:600 28px/50px Inter;color:'+INK+';text-align:center','What will this idea actually do to a living cell?',80,924,1760);
// ---- act 2: two kinds of cell

const tick=ctx('font:700 62px/1 Poppins;color:#fff;background:#4d8f7e;border-radius:50%;width:96px;height:96px;line-height:96px','✓',620,330,96);tick.style.width='96px';tick.style.left='572px';
const cross=ctx('font:700 62px/1 Poppins;color:#fff;background:#b76d66;border-radius:50%;width:96px;height:96px;line-height:96px','✕',1330,330,96);cross.style.left='1282px';
const tA=chip('Cell type A · responds',620,830,'mint',{fs:28});const tB=chip('Cell type B · disappoints',1330,830,'coral',{fs:28});

const stand=document.createElement('div');stand.style.cssText='position:absolute;left:400px;top:552px;width:180px;height:50px;background:'+INK+';border-radius:0 0 18px 18px;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)';mon.appendChild(stand);
const base=document.createElement('div');base.style.cssText='position:absolute;left:320px;top:598px;width:340px;height:22px;background:'+INK+';border-radius:12px';mon.appendChild(base);
const mcell=ico('animal-cell',300,290,330,{parent:mon});const mmol=ico('small-molecule',130,150,190,{parent:mon});
const mTxt=tx('font:600 28px/1.2 Inter;color:'+MUT+';white-space:normal','',0,0);mon.appendChild(mTxt);mTxt.style.cssText+=';left:560px;top:62px;width:380px';mTxt.innerHTML='Predicted response';
const bars=[['intended effect',.82,'#4d8f7e'],['other changes',.38,'#b76d66'],['other cell type',.55,'#557eaf']].map(([l,v,col],i)=>{
 const y=135+i*115;const lab=document.createElement('div');lab.style.cssText=`position:absolute;left:560px;top:${y}px;font:500 25px/1 Inter;color:${INK}`;lab.textContent=l;mon.appendChild(lab);
 const tr=document.createElement('div');tr.style.cssText=`position:absolute;left:560px;top:${y+36}px;width:370px;height:34px;border-radius:17px;background:#e2ebe7`;mon.appendChild(tr);
 const fl=document.createElement('div');fl.style.cssText=`position:absolute;left:560px;top:${y+36}px;width:0;height:34px;border-radius:17px;background:${col}`;mon.appendChild(fl);return {lab,tr,fl,v}});
mTxt.style.opacity=0;bars.forEach(b=>{b.lab.style.opacity=0;b.tr.style.opacity=0});
const vc=chip('A virtual cell',960,236,'mint',{fs:38,px:34,py:12,css:'box-shadow:0 0 0 0 rgba(77,143,126,.0)'});
const sub=ctx('font:500 30px/1.3 Inter;color:'+MUT,'test some possibilities first, then choose the next experiment',960,920,1400);
// ---- act 4: the open questions
const q1=box('b-coral',1010,290,780,240);const q1t=tx('font:700 40px/1.25 Poppins;color:'+INK+';white-space:normal','What can today’s AI really predict?',1050,320,700);
const q2=box('b-blue',1010,570,780,240);const q2t=tx('font:700 40px/1.25 Poppins;color:'+INK+';white-space:normal','How would we begin to build such a system?',1050,600,700);
const q1n=tx('font:500 28px/1.3 Inter;color:'+MUT+';white-space:normal','Be precise about the claim',1050,452,700);const q2n=tx('font:500 28px/1.3 Inter;color:'+MUT+';white-space:normal','Start from biology, data and measurement',1050,722,700);
return function update(t){
  const A1=1-out(t,c('c_kinds')-.2,.5);
  // act 1
  life(mol.e,t,c('c_idea'),c('c_kinds')-.3,{dy:20});const mx=mix(0,170,out(t,c('c_diff')+.3,1.2));mol.set({x:mx,op:parseFloat(mol.e.style.opacity),s:1+.03*track(Math.sin(t*3))*out(t,c('c_idea'),.5)});
  life(molC,t,c('c_idea')+.4,c('c_diff')+.2,{dy:10});
  life(cell.e,t,c('c_diff'),c('c_kinds')-.3,{dx:80,dy:0});
  const cp=out(t,c('c_kinds')+.2,1.0);
  aPath.style.opacity=out(t,c('c_diff')+.2,.6)*(1-out(t,c('c_what'),.5));
  life(cellC,t,c('c_diff')+.7,c('c_what')-.2);
  const qb=out(t,c('c_what'),.5)*A1;qs.forEach((q,i)=>{q.style.opacity=qb;q.style.transform=`translateY(${(track(Math.sin(t*3+i*1.7))*7).toFixed(1)}px) scale(${(.6+.4*qb).toFixed(2)})`});
  life(ban,t,c('c_what')-.1,c('c_test')-.3,{dy:6});life(banT,t,c('c_what')-.1,c('c_test')-.3,{dy:6});
  const ro=out(t,c('c_protein'),.6)*A1;rec.set({s:.7+.3*ro,op:ro});life(recC,t,c('c_protein')+.3,c('c_kinds')-.3,{dy:8});
  const rr=lin(t,c('c_protein')+.4,1.6);ring.setAttribute('r',10+80*rr);ring.style.opacity=(1-rr)*ro;
  const bu=lin(t,c('c_other'),1.5);burst.setAttribute('r',10+42*out(t,c('c_other'),1.0));burst.style.opacity=A1*(bu>0?1-.35*bu:0);life(burstC,t,c('c_other')+.5,c('c_kinds')-.3,{dy:8});
  // act 2
  life(cA2.e,t,c('c_kinds')+.2,c('c_test')-.3,{dx:-60,dy:0});life(cB.e,t,c('c_kinds')+.6,c('c_test')-.3,{dx:60,dy:0});
  const tk=out(t,c('c_kinds')+2.0,.5);tick.style.opacity=tk*(1-out(t,c('c_test')-.3,.3));tick.style.transform=`scale(${.4+.6*tk})`;
  const cr=out(t,c('c_kinds')+3.4,.5);cross.style.opacity=cr*(1-out(t,c('c_test')-.3,.3));cross.style.transform=`scale(${.4+.6*cr})`;
  life(tA,t,c('c_kinds')+1.0,c('c_test')-.3);life(tB,t,c('c_kinds')+1.5,c('c_test')-.3);
  // act 3
  const mI=out(t,c('c_test')+.2,.8);const mOut=out(t,c('c_ask')+.2,.8);
  mon.style.opacity=mI;const msc=mix(.9,1,mI)*mix(1,.62,mOut);mon.style.transform=`translate(${mix(0,-470,mOut)}px,${mix(0,-30,mOut)}px) scale(${msc})`;mon.style.transformOrigin='490px 320px';
  mcell.set({op:out(t,c('c_test')+1.2,.7),s:.8+.2*out(t,c('c_test')+1.2,.7)});
  const drop=out(t,c('c_test')+3.0,1.2);mmol.set({x:mix(0,120,drop),y:mix(0,90,drop),op:out(t,c('c_test')+2.6,.5)*(1-.0*drop),s:mix(1,.55,drop)});
  mTxt.style.opacity=out(t,c('c_test')+5.0,.6);bars.forEach((b,i)=>{const a=c('c_test')+5.2+i*.5;b.lab.style.opacity=out(t,a,.5);b.tr.style.opacity=out(t,a,.5);b.fl.style.width=(370*b.v*out(t,a+.3,1.1))+'px'});
  life(sub,t,c('c_test')+6.0,c('c_ask')-.2,{dy:6});
  const vp=out(t,c('c_promise'),.7);vc.style.opacity=vp;vc.style.transform=`translateY(${(1-vp)*14}px) scale(${.8+.2*vp+(track(Math.sin(t*4))*.012)*vp})`;vc.style.left=(mix(960,500,mOut)-vc._w/2)+'px';vc.style.top=mix(212,262,mOut)+'px';
  // act 4
  life(q1,t,c('c_ask')+.6,null,{dx:60,dy:0});life(q1t,t,c('c_ask')+.9,null,{dx:60,dy:0});life(q1n,t,c('c_ask')+1.6,null,{dx:60,dy:0});
  life(q2,t,c('c_ask')+3.8,null,{dx:60,dy:0});life(q2t,t,c('c_ask')+4.1,null,{dx:60,dy:0});life(q2n,t,c('c_ask')+4.9,null,{dx:60,dy:0});
};
});
