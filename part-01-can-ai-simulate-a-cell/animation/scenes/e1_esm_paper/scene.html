<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/wb.css"></head>
<body><div id="canvas"></div>
<script src="../../lib/wb.js"></script><script src="../../lib/figtour.js"></script>
<script>
SCENE_INIT({ep:1,part:3,partTitle:'How models learn',title:'Representations are not automatically coordinates',foot:'Lin et al. · ESM-2 / ESMFold · bioRxiv v2 (2022), Science (2023) · Actual local ESM-2 t6_8M run · no validated EGFR structure is claimed'},(S,C)=>{
const {el,at,show,out,mix}=WB;const K=C.cues;const INK='#183b32',MUT='#60716a';
const base=FIGTOUR(S,C);
function box(cls,x,y,w,h){const b=el('div','box '+cls);at(b,x,y,w,h);return b}
function tx(css,html,x,y,w){const e=el('div','t');e.style.cssText+=';'+css;e.innerHTML=html;at(e,x,y,w);return e}
// ---------- phase 2 : paper vs our run
const P2=[];const r2=e=>{P2.push(e);return e};
const cP=r2(box('b-blue',1260,222,580,196));const cPt=r2(tx('font:700 31px/1 Poppins;color:'+INK,'In the published paper',1288,244));
const cPb=r2(tx('font:400 28px/1.45 Inter;color:'+INK,'✓ contact predictions from the model<br>✓ structures from ESMFold',1288,300));
const cO=r2(box('b-mint',1260,436,580,262));const cOt=r2(tx('font:700 31px/1 Poppins;color:'+INK,'Our small ESM-2 run',1288,458));
const cOb=r2(tx('font:400 28px/1.45 Inter;color:'+INK,'✓ embeddings<br>✓ probabilities<br>✓ attention weights',1288,514));
const cOx=r2(tx('font:700 29px/1.3 Inter;color:#a65647',' ✕ a validated 3-D structure of EGFR',1288,636));
const cM=r2(box('b-amber',1260,716,580,150));const cMt=r2(tx('font:700 29px/1 Poppins;color:'+INK,'A different step',1288,736));
const cMb=r2(tx('font:400 27px/1.3 Inter;color:'+INK+';white-space:normal','Some contact methods add extra fitted machinery on top of attention.',1288,782,520));
// ---------- phase 3 : labelled outputs
const P3=[];const r3=e=>{P3.push(e);return e};
const tg=(txt,cls,x,y)=>{const e=r3(el('div','pill '+cls,txt));at(e,x,y);e.style.cssText+=';font-size:27px;padding:8px 22px;font-weight:600';return e};
const tagL=tg('Published figure · contact prediction (paper)','b-blue',100,236);
const tL=r3(box('',100,300,716,562));tL.style.cssText+=`;border:3px solid #cfd9d4;border-radius:12px;background:#fff url(../../data/fig/esm_x2.png) no-repeat 0 0;background-size:${2560*716/880}px auto`;
const tagR=tg('Our run · raw attention weights','b-mint',930,236);
const rI=r3(document.createElement('img'));rI.src='../e1_attention/assets/h1.png';rI.style.cssText='position:absolute;left:930px;top:300px;width:562px;height:562px;image-rendering:pixelated;border:3px solid #cfd9d4;border-radius:12px';S.appendChild(rI);
const neq=r3(tx('font:700 120px/1 Poppins;color:#b76d66;text-align:center;width:130px','≠',822,500));
const leg=r3(box('b-lav',1530,300,310,300));const legT=r3(tx('font:700 29px/1.2 Poppins;color:'+INK,'Labels we keep<br>on screen',1552,322,270));legT.style.whiteSpace='normal';
const l1=tg('Published figure','b-blue',1552,432);const l2=tg('Actual output','b-mint',1552,496);const l3=tg('Illustrative','b-amber',1552,560);
const warn=r3(el('div','pill b-amber','A picture of model attention never becomes a claim that we <b>recovered the protein’s fold</b>.'));at(warn,100,884);warn.style.cssText+=';font-size:30px;padding:14px 30px;text-align:left';
// ---------- phase 4 : recap
const P4=[];const r4=e=>{P4.push(e);return e};
const RC=[['b-blue','The training task','Hide an amino acid and predict it from its surroundings.',K.c_task],
          ['b-lav','The loss','A penalty, −ln p, on the probability given to the correct amino acid.',K.c_loss],
          ['b-mint','Representation ≠ physical structure','Numbers inside the model are not a validated fold.',K.c_diff]];
const rec=RC.map(([cls,h,b,tt],i)=>{const y=260+i*172;const bx=r4(box(cls,100,y,1720,148));
  const ck=r4(tx('font:700 44px/84px Poppins;color:#fff;background:#26765d;border-radius:50%;width:84px;height:84px;text-align:center','✓',138,y+32));
  const th=r4(tx('font:700 42px/1 Poppins;color:'+INK,h,260,y+28));const tb=r4(tx('font:400 32px/1.3 Inter;color:'+INK,b,260,y+82));return [bx,ck,th,tb,tt]});
const kicker=r4(tx('font:600 30px/1 Inter;color:'+MUT,'Part 3 recap · we now know …',100,214));
const bridge=r4(el('div','pill b-mint','Part 4 · Inspect the real code and its measured outputs  →'));at(bridge,100,808);bridge.style.cssText+=';font-size:38px;padding:24px 44px;font-weight:600;border:4px solid #4d8f7e';
return function update(t){
  base(t);
  const f2=1-out(t,K.c_keep-.3,.6);
  P2.forEach(e=>e.style.opacity=0);
  [[cP,cPt,cPb],[cO,cOt,cOb]].forEach((g,i)=>g.forEach(e=>{show(e,t,K.c_ours-.3+i*1.4,.6);e.style.opacity=parseFloat(e.style.opacity||0)*f2}));
  show(cOx,t,K.c_not,.6);cOx.style.opacity=parseFloat(cOx.style.opacity||0)*f2;
  [cM,cMt,cMb].forEach(e=>{show(e,t,K.c_some-.2,.6);e.style.opacity=parseFloat(e.style.opacity||0)*f2});
  // phase 3
  const f3=1-out(t,K.c_done-.4,.6);
  P3.forEach((e,i)=>{if(e instanceof HTMLElement){show(e,t,K.c_keep+.1+(e===warn?3.5:(e===leg||e===legT||e===l1||e===l2||e===l3)?1.5:0),.6);e.style.opacity=parseFloat(e.style.opacity||0)*f3}});
  neq.style.opacity=parseFloat(neq.style.opacity||0);
  // phase 4
  kicker.style.opacity=out(t,K.c_done,.6);
  rec.forEach(([bx,ck,th,tb,tt])=>{[bx,th,tb].forEach(e=>show(e,t,tt-.3,.6));const p=out(t,tt+.3,.4);ck.style.opacity=p;ck.style.transform=`scale(${(0.4+0.6*p).toFixed(3)})`});
  show(bridge,t,K.c_p4-.2,.7);
};
});
</script></body></html>
