<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/wb.css"></head>
<body><div id="canvas"></div>
<script src="../../lib/wb.js"></script>
<script>
SCENE_INIT({ep:1,part:3,partTitle:'How models learn',title:'How does a position use the context?',foot:'Lin et al., ESM-2 / ESMFold, bioRxiv v2 (2022), Science (2023) · Actual local ESM-2 t6_8M run (heads) · illustrative numbers elsewhere'},(S,C)=>{
const {el,at,show,out,ramp,mix,svg,lin}=WB;const clamp=WB.clamp;const K=C;
function box(cls,x,y,w,h){const b=el('div','box '+cls);at(b,x,y,w,h);return b}
function tx(css,html,x,y,w){const e=el('div','t');e.style.cssText+=';'+css;e.innerHTML=html;at(e,x,y,w);return e}
const INK='#183b32',MUT='#60716a';
const PA=[],PB=[],PC=[],PG=[];
const reg=(g,e)=>{g.push(e);return e};
// ---- svg layers (one per group so arrows sit behind chips)
const svA=reg(PA,svg('svg',{width:1920,height:1080,style:'position:absolute;left:0;top:0'},S));
const svB=reg(PB,svg('svg',{width:1920,height:1080,style:'position:absolute;left:0;top:0'},S));
const svC=reg(PC,svg('svg',{width:1920,height:1080,style:'position:absolute;left:0;top:0'},S));
[svA,svB,svC].forEach((s,i)=>{const d=svg('defs',{},s);const m=svg('marker',{id:'ah'+i,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:5,markerHeight:5,orient:'auto'},d);svg('path',{d:'M0 0L10 5L0 10z',fill:'#26765d'},m)});
// ---- seeded numbers
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mb(11);const vecs=[...Array(12)].map(()=>[...Array(4)].map(()=>Math.round((rnd()*1.8-.9)*10)/10));
const mixc=(a,b,p)=>a.map((v,i)=>Math.round(v+(b[i]-v)*p));
const cellCol=v=>{const p=Math.min(1,Math.abs(v)/.9);const tgt=v<0?[150,190,235]:[240,170,163];const c=mixc([255,255,255],tgt,.15+.7*p);return `rgb(${c})`};
const fv=v=>(v<0?'−':'')+Math.abs(v).toFixed(1);
function cell(g,x,y,w,h,v,fs){const b=reg(g,box('',x,y,w,h));b.style.cssText+=`;background:${cellCol(v)};border-radius:8px;border:2px solid #fff;font:500 ${fs||24}px/${h-4}px Inter;text-align:center;color:${INK}`;b.textContent=fv(v);return b}
// ================= PHASE A =================
const LET=['A','C','D','E','F','G','H','I','K'],FI=4;const XI=i=>100+i*118,SY=340;
const lbA=reg(PA,tx('font:500 28px/1 Inter;color:'+MUT+';text-align:center;width:1100px','information flows in from the rest of the sequence',100,240));
const strip=LET.map((l,i)=>{const b=reg(PA,box(i==FI?'b-coral':'b-blue',XI(i),SY,100,76));if(i==FI)b.style.cssText+=';border:4px solid #b76d66';const t=reg(PA,tx('font:700 40px/76px Poppins;color:'+INK+';text-align:center;width:100px',l,XI(i),SY));return [b,t]});
const arcs=LET.map((l,i)=>{if(i==FI)return null;const d=Math.abs(i-FI);const x1=XI(i)+50,x2=XI(FI)+50+(i-FI)*7;const p=svg('path',{d:`M${x1} ${SY-4} Q ${(x1+x2)/2} ${SY-30-15*d} ${x2} ${SY-6}`,stroke:'#26765d','stroke-width':4.5,fill:'none','marker-end':'url(#ah0)','stroke-linecap':'round',opacity:.8},svA);return p});
// vector table
const VT=[];for(let i=0;i<9;i++){for(let r=0;r<4;r++)VT.push([i,r,cell(PA,XI(i),440+r*44,100,40,vecs[i][r])]);}
const dots=LET.map((l,i)=>reg(PA,tx('font:700 30px/1 Inter;color:'+MUT+';text-align:center;width:100px','⋮',XI(i),618)));
const fCol=reg(PA,box('',XI(FI)-6,432,112,222));fCol.style.cssText+=';border:4px solid #b76d66;border-radius:18px';
const vlab=reg(PA,tx('font:600 30px/1.2 Inter;color:'+INK+';text-align:center;width:1150px','each position = a <u>vector</u>: a list of numbers',100,664));
const vsub=reg(PA,tx('font:400 24px/1 Inter;color:'+MUT+';text-align:center;width:1150px','illustrative values',100,704));
// Q K V rows
const FV=vecs[FI];const QV=vecs[9],KV=vecs[10],VV=vecs[11];
const fvc=FV.map((v,i)=>cell(PA,120+i*78,790,78,44,v));
const fvl=reg(PA,tx('font:600 25px/1.2 Inter;color:#b76d66;text-align:center;width:312px','F’s vector',120,844));
const ROWSQ=[['Query','b-blue',705,QV,'#557eaf','query: what it looks for',K.c_query],['Key','b-lav',790,KV,'#8b75b0','key: what it offers',K.c_key],['Value','b-mint',875,VV,'#4d8f7e','value: what it contributes',K.c_value]];
const qkv=ROWSQ.map(([n,cls,y,vv,col,lab,tt])=>{const cs=vv.map((v,i)=>cell(PA,560+i*78,y,78,44,v));cs.forEach(c=>c.style.borderColor=col);
  const bar=reg(PA,box('',552,y-4,328,52));bar.style.cssText+=`;border:4px solid ${col};border-radius:14px;background:transparent`;
  const l=reg(PA,tx('font:600 27px/1 Inter;color:'+col,lab,900,y+8));
  const ar=svg('path',{d:`M440 812 C 480 812 490 ${y+22} 546 ${y+22}`,stroke:'#26765d','stroke-width':5,fill:'none','marker-end':'url(#ah0)','stroke-linecap':'round'},svA);
  return {cs,bar,l,ar,tt}});
// ---- glossary cards (right)
const GL=[['b-blue',250,'Transformer','ESM-2 is a transformer.<br>Attention is one of its parts.',K.c_arch-.2],
 ['b-lav',420,'Vector','A position becomes a list<br>of numbers.',K.c_inside],
 ['b-mint',590,'Query · key · value','Three learned versions of that<br>vector, each with its own job.',K.c_qkv],
 ['b-amber',760,'Weights','Query–key matches become weights:<br>how much of each value to mix.',K.c_w]];
const gl=GL.map(([cls,y,h,b,tt])=>{const bx=reg(PG,box(cls,1290,y,550,150));const th=reg(PG,tx('font:700 33px/1 Poppins;color:'+INK,h,1318,y+20));const tb=reg(PG,tx('font:400 28px/1.3 Inter;color:'+INK,b,1318,y+68));return [bx,th,tb,tt]});
// ================= PHASE B (attention table for position F) =================
const RY=i=>340+i*58;
const heads=[['key',175,100],['match',300,100],['weight',430,262],['value',780,100]];
const hd=heads.map(([h,x,w])=>reg(PB,tx('font:600 25px/1 Inter;color:'+MUT+';text-align:center;width:'+w+'px',h,x,302)));
const qp=reg(PB,el('div','pill b-blue','F’s query'));at(qp,276,236);qp.style.cssText+=';font-size:28px;padding:8px 22px;border:3px solid #557eaf;font-weight:600';
const qar=svg('path',{d:'M350 284 L350 300',stroke:'#557eaf','stroke-width':5,fill:'none','marker-end':'url(#ah1)'},svB);
const SC=[.2,.5,.4,1.9,1.6,1.1,.3,.1,.2];const ex=SC.map(Math.exp),sm=ex.reduce((a,b)=>a+b,0),W=ex.map(v=>v/sm);
const rowsB=LET.map((l,i)=>{const y=RY(i);const isF=i==FI;
  const let_=reg(PB,box(isF?'b-coral':'b-blue',90,y,64,50));let_.style.cssText+=';border-radius:14px'+(isF?';border:3px solid #b76d66':'');
  const lt=reg(PB,tx('font:700 28px/50px Poppins;color:'+INK+';text-align:center;width:64px',l,90,y));
  const key=reg(PB,box('b-lav',175,y,100,50));key.style.borderRadius='14px';const kt=reg(PB,tx('font:600 26px/50px Inter;color:#5d4a8a;text-align:center;width:100px','K',175,y));
  const sc=reg(PB,tx('font:600 28px/50px Inter;color:'+INK+';text-align:center;width:100px;background:#f4f7f5;border-radius:25px;height:50px','',300,y));sc.textContent=fv(SC[i]).replace('−','−');
  const tr=reg(PB,box('',430,y+8,262,34));tr.style.cssText+=';background:#eef3f0;border-radius:17px';
  const fl=reg(PB,box('',430,y+8,262,34));fl.style.cssText+=';background:#4d8f7e;border-radius:17px';
  const wl=reg(PB,tx('font:700 24px/50px Poppins;color:'+INK,W[i].toFixed(2),700,y));
  const val=reg(PB,box('b-mint',780,y,100,50));val.style.borderRadius='14px';const vt=reg(PB,tx('font:600 26px/50px Inter;color:#26765d;text-align:center;width:100px','V',780,y));
  return {let_,lt,key,kt,sc,tr,fl,wl,val,vt,y}});
const sumL=reg(PB,tx('font:500 24px/1 Inter;color:'+MUT+';text-align:center;width:262px','weights add up to 1',430,RY(8)+60));
const RC={x:1000,y:520,w:240,h:170};
const resB=reg(PB,box('b-mint',RC.x,RC.y,RC.w,RC.h));resB.style.cssText+=';border:4px solid #4d8f7e';
const resT=reg(PB,tx('font:700 32px/1.1 Poppins;color:'+INK,'F, refined',RC.x+24,RC.y+22));
const resS=reg(PB,tx('font:400 26px/1.3 Inter;color:'+MUT,'a weighted mix<br>of the values',RC.x+24,RC.y+76));
const lines=rowsB.map((r,i)=>svg('line',{x1:892,y1:r.y+25,x2:RC.x-4,y2:RC.y+RC.h/2,stroke:'#4d8f7e','stroke-width':2+W[i]*20,'stroke-linecap':'round',opacity:.55},svB));
const trav=rowsB.map(()=>{const c=svg('circle',{r:8,fill:'#26765d',stroke:'#fff','stroke-width':3},svB);return c});
const ban1=reg(PB,el('div','pill b-lav','In plain language: the position <b>gathers and mixes</b> information from the sequence.'));at(ban1,80,892);ban1.style.cssText+=';font-size:29px;padding:16px 30px;text-align:left';
const ban2=reg(PB,el('div','pill b-amber','These names describe <b>numerical operations</b> — not questions asked by a protein.'));at(ban2,80,892);ban2.style.cssText+=';font-size:31px;padding:16px 32px;text-align:left';
// ================= PHASE C (heads, layers, real map) =================
const IMG=(src,x,y,w,h)=>{const i=reg(PC,document.createElement('img'));i.src=src;i.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;image-rendering:pixelated;border:3px solid #cfd9d4;border-radius:6px`;S.appendChild(i);return i};
const hdr1=reg(PC,tx('font:600 30px/1 Inter;color:'+INK,'Multiple attention heads · real EGFR window',100,240));
const HM=[['assets/h1.png','Head 1'],['assets/h3.png','Head 3'],['assets/h8.png','Head 8']];
const hm=HM.map(([src,n],i)=>{const x=100+i*300;const im=IMG(src,x,290,260,260);const l=reg(PC,tx('font:700 28px/1 Poppins;color:'+INK+';text-align:center;width:260px',n,x,566));return [im,l]});
const hsub=reg(PC,tx('font:400 26px/1.3 Inter;color:'+MUT+';white-space:normal','Same sequence, different learned combinations.<br>Each small map has its own colour scale.',100,610,840));
const hdr2=reg(PC,tx('font:600 30px/1 Inter;color:'+INK,'Multiple layers refine the representation',100,700));
const LY=[['Layer 1',100],['Layer 2',320],['· · ·',540],['Layer 6',760]];
const lyr=LY.map(([n,x],i)=>{const b=reg(PC,box(i==2?'':'b-lav',x,752,170,84));if(i==2)b.style.cssText+=';background:transparent';const t=reg(PC,tx('font:700 29px/84px Poppins;color:'+INK+';text-align:center;width:170px',n,x,752));let a=null;if(i<3)a=svg('path',{d:`M${x+178} 794 L${x+212} 794`,stroke:'#26765d','stroke-width':6,fill:'none','marker-end':'url(#ah2)','stroke-linecap':'round'},svC);return [b,t,a]});
const lnote=reg(PC,tx('font:500 26px/1.3 Inter;color:#26765d','Our small ESM-2: 6 layers × 20 heads = 120 attention maps',100,862,860));
const bigH=reg(PC,tx('font:600 28px/1 Inter;color:'+INK,'Final layer · head 1 · query rows × key columns',1030,240));
const BX=1050,BY=290,BS=540;const big=IMG('assets/h1.png',BX,BY,BS,BS);
const ql=reg(PC,tx('font:400 24px/1 Inter;color:'+MUT+';text-align:center;width:540px','key position →',BX,BY+BS+12));
const qlr=reg(PC,tx('font:400 24px/1 Inter;color:'+MUT+';transform:rotate(-90deg);transform-origin:left top;white-space:nowrap','query position →',BX-44,BY+BS-4));
const cb=reg(PC,box('',BX+BS+30,BY,24,BS));cb.style.cssText+=';background:linear-gradient(#16604a,#ffffff);border:2px solid #cfd9d4;border-radius:6px';
const cbT=reg(PC,tx('font:400 22px/1.2 Inter;color:'+MUT,'0.187<br>raw',BX+BS+62,BY-4));const cbB=reg(PC,tx('font:400 22px/1 Inter;color:'+MUT,'0',BX+BS+62,BY+BS-22));
const spot={q:33,k:22};const spx=BX+(spot.k+.5)/61*BS,spy=BY+(spot.q+.5)/61*BS;
const svT=reg(PC,svg('svg',{width:1920,height:1080,style:'position:absolute;left:0;top:0'},S));
const ring=svg('circle',{cx:spx,cy:spy,r:34,fill:'none',stroke:'#b76d66','stroke-width':7},svT);
const spotL=reg(PC,tx('font:700 27px/1 Poppins;color:#a65647;background:#fff;border-radius:10px;padding:6px 12px;border:3px solid #b76d66','bright spot',spx+48,spy-70));
const ban3=reg(PC,el('div','pill b-amber','A bright spot is <b>not</b>, by itself, proof that two amino acids touch.'));at(ban3,1000,876);ban3.style.cssText+=';font-size:28px;padding:12px 26px;text-align:left;white-space:normal;width:840px;line-height:1.25';
const mark=reg(PC,box('',100-6,290-6,272,272));mark.style.cssText+=';border:5px solid #26765d;border-radius:12px';
return function update(t){
  // ---------- phase A
  const tB=K.c_cmp-.5,fA=1-out(t,tB,.6);
  svA.style.opacity=fA;
  show(lbA,t,.4,.6);strip.forEach(([b,tt],i)=>{show(b,t,.3+i*.08,.5,{dy:10});show(tt,t,.3+i*.08,.5,{dy:10})});
  arcs.forEach((p,i)=>{if(!p)return;const k=out(t,.9+Math.abs(i-FI)*.35,.9);p.style.opacity=k*.8;});
  VT.forEach(([i,r,c])=>show(c,t,K.c_inside+.2+i*.1+r*.05,.5,{dy:8}));dots.forEach((d,i)=>show(d,t,K.c_inside+1.2,.5));
  show(fCol,t,K.c_vec-1.2,.6,{dy:0});show(vlab,t,K.c_vec-.5,.6);show(vsub,t,K.c_vec+.4,.6);
  fvc.forEach((c,i)=>show(c,t,K.c_qkv-.2+i*.07,.5));show(fvl,t,K.c_qkv,.5);
  qkv.forEach((r,j)=>{r.cs.forEach((c,i)=>show(c,t,r.tt-.5+i*.06,.5));show(r.bar,t,r.tt-.5,.5,{dy:0});show(r.l,t,r.tt-.1,.6);r.ar.style.opacity=out(t,r.tt-.7,.6)*fA});
  PA.forEach(e=>{if(e===svA)return;e.style.opacity=parseFloat(e.style.opacity||0)*fA});
  // ---------- glossary
  const fG=1-out(t,K.c_heads-.5,.6);
  gl.forEach(([bx,th,tb,tt])=>{[bx,th,tb].forEach(e=>{show(e,t,tt,.6);e.style.opacity=parseFloat(e.style.opacity||0)*fG})});
  // ---------- phase B
  const fB=1-out(t,K.c_heads-.5,.6);const sB=out(t,tB,.6);
  svB.style.opacity=fB;
  hd.forEach((h,i)=>{show(h,t,tB+.1+i*.05,.5);h.style.opacity=parseFloat(h.style.opacity||0)*fB});
  rowsB.forEach((r,i)=>{
    [r.let_,r.lt,r.key,r.kt,r.val,r.vt].forEach(e=>{show(e,t,tB+.2+i*.05,.5,{dy:6})});
    const sT=K.c_cmp+.3+i*.2;show(r.sc,t,sT,.5,{dy:6});
    show(r.tr,t,K.c_w,.5,{dy:0});
    const wp=out(t,K.c_w+.1+i*.08,.8);r.fl.style.opacity=wp>0?1:0;r.fl.style.width=(262*W[i]/Math.max(...W)*wp).toFixed(1)+'px';
    show(r.wl,t,K.c_w+.6+i*.08,.5,{dy:0});
    [r.let_,r.lt,r.key,r.kt,r.val,r.vt,r.sc,r.tr,r.fl,r.wl].forEach(e=>e.style.opacity=parseFloat(e.style.opacity||0)*fB);
  });
  show(qp,t,K.c_cmp-.2,.5);qar.style.opacity=out(t,K.c_cmp+.1,.5)*fB;qp.style.opacity=parseFloat(qp.style.opacity||0)*fB;
  show(sumL,t,K.c_w+1.6,.5);sumL.style.opacity=parseFloat(sumL.style.opacity||0)*fB;
  lines.forEach((l,i)=>{l.style.opacity=out(t,K.c_mix-.2+i*.04,.5)*.55*fB});
  trav.forEach((c,i)=>{const p=lin(t,K.c_mix+.1+i*.07,.9);const r=rowsB[i];c.setAttribute('cx',mix(892,RC.x-4,p));c.setAttribute('cy',mix(r.y+25,RC.y+RC.h/2,p));c.style.opacity=(p>0&&p<1)?fB:0});
  [resB,resT,resS].forEach(e=>{show(e,t,K.c_mix+1.0,.7);e.style.opacity=parseFloat(e.style.opacity||0)*fB});
  const b1=out(t,K.c_plain-.2,.6)*(1-out(t,K.c_num-.4,.5))*fB,b2=out(t,K.c_num-.1,.6)*fB;ban1.style.opacity=b1;ban2.style.opacity=b2;
  // ---------- phase C
  const tC=K.c_heads;
  PC.forEach(e=>{if(e!==svC&&e!==svT)e.style.opacity=0});svC.style.opacity=1;svT.style.opacity=1;
  show(hdr1,t,tC,.6);hm.forEach(([im,l],i)=>{show(im,t,tC+.3+i*.5,.6,{dy:10});show(l,t,tC+.5+i*.5,.6,{dy:0})});show(hsub,t,tC+2.2,.6);
  show(hdr2,t,K.c_layers-.1,.6);lyr.forEach(([b,tt,a],i)=>{show(b,t,K.c_layers+.2+i*.4,.5,{dy:8});show(tt,t,K.c_layers+.2+i*.4,.5,{dy:8});if(a)a.style.opacity=out(t,K.c_layers+.5+i*.4,.4)});
  show(lnote,t,K.c_layers+2.2,.6);
  show(bigH,t,K.c_inspect-.2,.6);show(big,t,K.c_inspect,.7,{dy:8});show(ql,t,K.c_inspect+.4,.5);qlr.style.opacity=out(t,K.c_inspect+.4,.5);show(cb,t,K.c_inspect+.4,.5);show(cbT,t,K.c_inspect+.5,.5);show(cbB,t,K.c_inspect+.5,.5);
  show(mark,t,K.c_inspect,.5,{dy:0});
  ring.style.opacity=out(t,K.c_bright,.5);ring.setAttribute('r',(34+10*(1-out(t,K.c_bright,.5))).toFixed(1));
  show(spotL,t,K.c_bright+.3,.5);show(ban3,t,K.c_bright+.2,.6);
};
});
</script></body></html>
