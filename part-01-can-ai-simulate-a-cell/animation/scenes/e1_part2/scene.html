<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/wb.css"></head>
<body><div id="canvas"></div>
<script src="../../lib/wb.js"></script><script src="../../assets3/icons.js"></script><script src="../../lib/bio.js"></script>
<script>
SCENE_INIT({ep:1,part:2,partTitle:'Define the research problem',title:'Part 2 · Define the research problem',foot:'Define the research problem · schematic illustrations'},(S,C)=>{
const {out,ramp,lin,mix,track}=WB;const c=k=>Math.max(C[k],0.05);const win=(t,a,b,d)=>out(t,a,d||.5)*(1-out(t,b,.4));
const sv=svgLayer(S);arrowDefs(sv,'arw',GRN);arrowDefs(sv,'arl',LAV);
// badge + tracker
const badge=box('b-mint',80,230,600,250);const bT=tx('font:600 30px/1 Inter;color:'+MINT,'Part 2 of 4',116,252);const bH=tx('font:700 50px/1.1 Poppins;color:'+INK+';white-space:normal','Define the research problem',116,296,540);
const seg=[0,1,2,3].map(i=>{const e=box('',116+i*134,430,120,12);e.style.cssText+=';border-radius:6px;background:#cfd9d4';const f=box('',116+i*134,430,0,12);f.style.cssText+=';border-radius:6px;background:#26765d';return {e,f}});
// recap row (we already know…)
const rk=[['animal-cell',100,'cells'],['dna-helix',72,'DNA'],['rna-strand',100,'RNA'],['folded-protein',100,'proteins']];
const RX=i=>810+i*270;
const rc=rk.map(([k,w,n],i)=>({ic:ico(k,RX(i),320,w),ch:chip(n,RX(i),395,['coral','blue','amber','mint'][i],{fs:26}),tk:WB.svg('g',{opacity:0},sv)}));
rc.forEach((r,i)=>{WB.svg('circle',{cx:RX(i)+62,cy:262,r:20,fill:'#4d8f7e',stroke:'#fff','stroke-width':4},r.tk);WB.svg('path',{d:`M${RX(i)+52} ${262} L ${RX(i)+60} ${271} L ${RX(i)+74} ${253}`,stroke:'#fff','stroke-width':5,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},r.tk)});

// three question cards
const CX=[80,690,1300],CW=540;
const cards=[['b-coral','The change','What useful change do we want?','drug-diffusion',190],['b-blue','The information','What information do we have?','molecular-graph',170],['b-amber','The evidence','What observation would count as evidence?','well-plate',210]].map(([cls,h,q,ik,iw],i)=>({bx:box(cls,CX[i],500,CW,300),h:tx('font:700 40px/1 Poppins;color:'+INK,h,CX[i]+36,524,CW-60),q:tx('font:500 29px/1.25 Inter;color:'+INK+';white-space:normal',q,CX[i]+36,584,CW-300),ic:ico(ik,CX[i]+CW-150,680,iw)}));
const arrs=[0,1,2].map(i=>WB.svg('path',{d:`M${CX[i]+CW/2} 810 L ${CX[i]+CW/2} 862`,stroke:GRN,'stroke-width':8,fill:'none','stroke-linecap':'round','marker-end':'url(#arw)'},sv));
const task=box('b-mint',80,872,1160,100);const tt=ctx('font:700 40px/100px Poppins;color:'+INK,'→  the prediction task',660,872,1100);tt.style.lineHeight='100px';
const aL=WB.svg('path',{d:'M1260 922 L 1340 922',stroke:LAV,'stroke-width':8,fill:'none','stroke-linecap':'round','stroke-dasharray':'3 12','marker-end':'url(#arl)'},sv);
const mdl=box('',1360,872,480,100);mdl.style.cssText+=';border:5px dashed #8b75b0;border-radius:24px;background:rgba(236,230,251,.55);opacity:0';const mi=ico('attention-network',1430,922,86);const mt=ctx('font:700 32px/1.1 Poppins;color:'+LAV,'then the model',1680,892,360);const ms=ctx('font:500 24px/1.2 Inter;color:'+MUT,'after the question is clear',1680,934,360);
return function update(t){
  const A=k=>c(k);
  life(badge,t,0,null,{dy:20});life(bT,t,.2,null,{dy:8});life(bH,t,.35,null,{dy:8});
  seg.forEach((s,i)=>{s.e.style.opacity=out(t,.5+i*.1,.4);s.f.style.opacity=1});seg[0].f.style.width=(120)+'px';seg[1].f.style.width=(120*out(t,1.2,1.4))+'px';
  const kt=[A('c_know')+.2,A('c_dnarna')-.1,A('c_dnarna')+.7,A('c_prot')];const ke=A('c_change')-.3;
  rc.forEach((r,i)=>{const a=kt[i];r.ic.set({op:win(t,a,ke,.5),s:.7+.3*out(t,a,.6),y:track(Math.sin(t*1.6+i)*4)});life(r.ch,t,a+.15,ke,{dy:6});r.tk.setAttribute('opacity',out(t,a+.5,.4)*(1-out(t,ke,.4)))});
  const ct=[A('c_change')-.1,A('c_info')-.1,A('c_obs')-.1];
  cards.forEach((cd,i)=>{life(cd.bx,t,ct[i],null,{dy:24});life(cd.h,t,ct[i]+.2,null,{dy:8});life(cd.q,t,ct[i]+.4,null,{dy:8});cd.ic.set({op:out(t,ct[i]+.3,.6),s:.75+.25*out(t,ct[i]+.3,.6),y:track(Math.sin(t*1.6+i*1.3)*5)})});
  arrs.forEach((a,i)=>pathGrow(a,out(t,A('c_task')+.1*i,.6)));
  life(task,t,A('c_task')+.4,null,{dy:14});life(tt,t,A('c_task')+.7,null,{dy:8});
  const mp=out(t,A('c_model'),.6);pathGrow(aL,mp);mdl.style.opacity=mp;mdl.style.transform=`translateX(${((1-mp)*30).toFixed(1)}px)`;mi.set({op:mp});life(mt,t,A('c_model')+.3,null,{dy:6});life(ms,t,A('c_model')+.6,null,{dy:6});
};});
</script></body></html>
