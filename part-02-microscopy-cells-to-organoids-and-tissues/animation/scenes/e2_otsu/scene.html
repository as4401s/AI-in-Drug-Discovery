<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/wb.css"></head>
<body><div id="canvas"></div>
<script src="../../lib/wb.js"></script><script src="../../assets2/data2.js"></script><script src="../../lib/ep2.js"></script>
<script>
SCENE_INIT({ep:2,part:3,partTitle:'A real pixels-to-measurements experiment',title:'Otsu’s rule is a baseline, not biological truth',foot:'Otsu (1979) · Official scikit-image docs · NumPy teaching baseline · Actual saved Python run · candidate regions, not validated cell counts'},(S,K)=>{
const {out,show,mix}=WB;
// prefix counts of raw values
const cnt=new Uint32Array(65537);for(let i=0;i<65536;i++)cnt[D.P[i]+1]++;for(let v=1;v<=65536;v++)cnt[v]+=cnt[v-1];
const nBelow=T=>cnt[Math.min(65536,T+1)];// pixels with value <= T
const HX=100,HY=334,HW=800,HH=240,XMAX=D.HB.length*D.BW;
const hist=HISTO(S,HX,HY,HW,HH);
const hTitle=tx('font:700 27px/1.2 Inter;color:'+INK,'How many pixels have each brightness?',HX,HY-96,800);
const hSub=tx('font:500 22px/1.25 Inter;color:'+MUT+';white-space:normal','real nucleus plane (index 30) · bins of 250 raw units<br>axis cropped at 32,000 (largest pixel value: 58,327)',HX,HY-64,800);
const ticks=[0,8000,16000,24000,32000].map(v=>tx('font:500 22px/1 Inter;color:'+MUT+';text-align:center;width:120px',v.toLocaleString('en-US'),HX+v/XMAX*HW-60,HY+HH+10));
const yl=tx('font:500 21px/1 Inter;color:'+MUT+';white-space:nowrap','pixels per bin',HX,HY-0,200);yl.style.display='none';
// overlap zone
const oz=box('',HX+6000/XMAX*HW,HY-4,8000/XMAX*HW,HH+4);oz.style.cssText+=';border:3px dashed #e0a43a;border-radius:10px;background:rgba(224,164,58,.10);box-sizing:border-box';
const ozL=tx('font:700 22px/1.2 Inter;color:#8b6a1a;white-space:normal;text-align:center;background:#fff;padding:3px 8px;border-radius:8px',"dim nuclei and background<br>can share these values",HX+6000/XMAX*HW+30,HY+60,260);
// score curve
const SX=HX,SY=700,SH=100;
const svc=WB.svg('svg',{width:1920,height:1080,style:'position:absolute;left:0;top:0'},S);
const scAxis=WB.svg('line',{x1:SX,x2:SX+HW,y1:SY+SH+1,y2:SY+SH+1,stroke:'#8aa59b','stroke-width':3},svc);
const scLine=WB.svg('polyline',{fill:'none',stroke:'#26765d','stroke-width':5,'stroke-linejoin':'round','points':''},svc);
const scDot=WB.svg('circle',{r:9,fill:COR,cx:SX,cy:SY+SH},svc);
const scT=tx('font:700 24px/1.2 Inter;color:'+INK,'Split score for each possible T',SX,SY-66,700);
const scS=tx('font:500 21px/1 Inter;color:'+MUT,'(between-class variance, scaled so the best split = 1.0)',SX,SY-38,700);
const best=tx('font:700 24px/1 Poppins;color:#fff;background:#26765d;border-radius:14px;padding:7px 14px;white-space:nowrap','best split · T = 10,432',SX+D.T/XMAX*HW+16,SY+34);
// mask preview
const pv=PLANE(S,940,HY-96,270);const pvCap=tx('font:600 22px/1.2 Inter;color:'+MUT+';white-space:normal','mask at the current T<br><span style="font-weight:500">green = selected pixels</span>',940,HY-96+276,300);
// card
const tc=box('b-lav',1260,622,580,258);const tcT=tx('font:600 24px/1 Inter;color:'+MUT,'Dividing point T',1288,646,520);
const tcV=tx('font:700 66px/1 Poppins;color:'+INK,'T = 10,432',1288,686,520);
const tcA=tx('font:600 27px/1.35 Inter;color:'+BLU+';white-space:nowrap','group A (≤ T): 0 px',1288,780,540);
const tcB=tx('font:600 27px/1.35 Inter;color:'+AMB+';white-space:nowrap','group B (&gt; T): 0 px',1288,820,540);
const banner=box('b-amber',100,924,1740,50);const banT=tx('font:600 27px/50px Inter;color:'+INK+';text-align:center','Otsu optimizes a histogram criterion. It does not understand a nucleus.',100,924,1740);
const notes=NOTEBOX(S,{x:1260,y:222,w:580,h:380,notes:[
 {a:K.c_intro,b:K.c_hist-.1,title:'Otsu’s method',body:'Our baseline <b>chooses its threshold automatically</b> with this rule.'},
 {a:K.c_hist,b:K.c_div-.1,title:'Step 1 · histogram',body:'Count <b>how many pixels have each brightness value</b>.'},
 {a:K.c_div,b:K.c_look-.1,title:'Step 2 · try dividing points',body:'Every possible threshold T splits the pixels into <b>2 groups</b>: below T and above T.'},
 {a:K.c_look,b:K.c_know-.1,title:'Step 3 · score each split',body:'Prefer the T whose two groups are <b>most distinct</b> — balanced against how many pixels each group holds.'},
 {a:K.c_know,b:K.c_fail-.1,title:'What Otsu does not know',body:'',subs:[[K.c_know,'what a <b>nucleus</b> is'],[K.c_exp,'the <b>experimental question</b>'],[K.c_dmg,'whether a cell is <b>damaged</b>']]},
 {a:K.c_fail,b:K.c_insp-.1,title:'It can still go wrong',body:'',subs:[[K.c_unev,'<b>uneven illumination</b>'],[K.c_over,'<b>overlapping</b> intensity distributions'],[K.c_bright,'bright <b>background</b>'],[K.c_poor,'→ a neat T can be a <b>poor biological selection</b>']]},
 {a:K.c_insp,b:null,title:'So inspect the output',body:'Compare it with a <b>baseline or an annotation</b> that suits the task.'}]});
return function update(t){
  show(hTitle,t,K.c_hist,.6);show(hSub,t,K.c_hist+.2,.6);
  const grow=out(t,K.c_count,2.2);
  // sweep
  let T=mix(2500,7000,out(t,K.c_div,3.4));T=mix(T,30000,out(t,K.c_look,3.6));T=mix(T,D.T,out(t,K.c_bal,2.8));
  let Tq=Math.round(T/100)*100;if(Math.abs(T-D.T)<60)Tq=D.T;WB.track(Tq);
  const showT=out(t,K.c_div,.5)>0.01;
  hist.set(grow,showT?Tq:null,t>=K.c_two);
  hist.axis.style.opacity=out(t,K.c_hist,.5);
  ticks.forEach(e=>show(e,t,K.c_hist,.6,{dy:0}));
  // curve
  const cv=out(t,K.c_look,.5);const tm=mix(7000,30000,out(t,K.c_look,3.6));const tmq=Math.round(tm/250)*250;WB.track(tmq);
  const n=Math.min(D.OT.length-1,Math.round(tmq/D.BW));const pts=[];for(let i=0;i<=n;i++)pts.push((SX+i*D.BW/XMAX*HW).toFixed(1)+','+(SY+SH-D.OT[i]*SH).toFixed(1));
  scLine.setAttribute('points',pts.join(' '));scLine.style.opacity=cv;scAxis.style.opacity=cv;
  const di=Math.min(D.OT.length-1,Math.round(Tq/D.BW));scDot.setAttribute('cx',SX+Tq/XMAX*HW);scDot.setAttribute('cy',SY+SH-D.OT[di]*SH);scDot.style.opacity=cv;
  show(scT,t,K.c_look,.6);show(scS,t,K.c_look+.2,.6);show(best,t,K.c_bal+2.4,.6,{dy:0});
  // overlap zone
  const oa=out(t,K.c_unev,.6)*(1-out(t,K.c_insp,.5));oz.style.opacity=oa;ozL.style.opacity=oa;
  // preview mask
  const pa=out(t,K.c_div,.6);pv.draw({T:Tq,alpha:.6});pv.cv.style.opacity=pa;pvCap.style.opacity=pa;
  // card
  const cvv=out(t,K.c_div,.5);[tc,tcT,tcV,tcA,tcB].forEach(e=>e.style.opacity=cvv);
  tcV.textContent='T = '+Tq.toLocaleString('en-US');
  const a=nBelow(Tq),b=65536-a;tcA.innerHTML='group A (≤ T): <b>'+a.toLocaleString('en-US')+'</b> px';tcB.innerHTML='group B (&gt; T): <b>'+b.toLocaleString('en-US')+'</b> px';
  show(banner,t,K.c_insp+1.5,.6,{dy:0});show(banT,t,K.c_insp+1.7,.6,{dy:0});
  notes.update(t);
  return 0;
};
});
</script></body></html>
