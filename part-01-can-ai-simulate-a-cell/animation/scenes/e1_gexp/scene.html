<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/wb.css"></head>
<body><div id="canvas"></div>
<script src="../../lib/wb.js"></script><script src="../../assets3/icons.js"></script><script src="../../lib/bio.js"></script>
<script>
SCENE_INIT({ep:1,part:1,partTitle:'Biology foundations',title:'Gene expression · using the information',foot:'Biology foundations · schematic illustrations · bars show illustrative levels, not measured data · National Human Genome Research Institute concepts'},(S,C)=>{
const {out,ramp,lin,mix,track}=WB;const c=k=>Math.max(C[k],0.05);
const X0=700;const win=(t,a,b,d)=>out(t,a,d||.5)*(1-out(t,b,.4));
const lh=ico('expression-heatmap',330,650,520);const lc=chip('Gene expression',330,930,'lav',{fs:32,px:28});
const nk=[['c_def','Gene expression','using the information in a gene to produce a <b>functional RNA or protein</b> product'],['c_reg','Regulation','controls <b>when</b> and <b>how much</b> of a product is made — not every gene is permanently on at the same level'],['c_two','Same DNA, different behaviour','two cells can have very similar DNA yet <b>use that information differently</b>'],['c_same','Expression can change','the same cell can change its expression under <b>new conditions</b>'],['c_rnam','RNA measurements','give researchers <b>one way to observe</b> that change'],['c_more','More RNA ≠ more active protein','several <b>steps and controls</b> lie between RNA and protein'],['c_keep','Keep it simple','<b>DNA records information</b>, <b>expression concerns its use</b>, an <b>experiment captures one view</b> of the resulting state']];
const notes=NOTES({x:X0,y:226,w:1160,h:178,tfs:30,bfs:28,notes:nk.map((n,i)=>({a:c(n[0]),b:i<nk.length-1?c(nk[i+1][0])-.1:null,title:n[1],body:n[2]}))});
const svB=svgLayer(S);arrowDefs(svB,'ar',GRN);arrowDefs(svB,'arp',LAV);arrowDefs(svB,'arc',COR);
// 1 definition
const bar=box('',760,500,1060,40);bar.style.cssText+=';background:#eaf3ef;border:3px solid #8aa59b;border-radius:20px;transform-origin:left center;opacity:0';
const g1=box('',1000,496,300,48);g1.style.cssText+=';background:rgba(224,164,58,.35);border:4px solid #e0a43a;border-radius:14px;opacity:0';
const gcp=chip('a gene',1150,470,'amber',{fs:26});
const d1=WB.svg('path',{d:'M1100 556 L 960 640',stroke:GRN,'stroke-width':8,fill:'none','stroke-linecap':'round','marker-end':'url(#ar)'},svB),d2=WB.svg('path',{d:'M1200 556 L 1500 640',stroke:GRN,'stroke-width':8,fill:'none','stroke-linecap':'round','marker-end':'url(#ar)'},svB);
const c1=box('b-lav',760,660,420,250),c2=box('b-mint',1300,660,420,250);const i1=ico('rna-strand',970,805,190),i2=ico('folded-protein',1510,805,190);
const t1=ctx('font:700 32px/1.1 Poppins;color:'+INK,'functional RNA',970,680,380),t2=ctx('font:700 32px/1.1 Poppins;color:'+INK,'functional protein',1510,680,380);
const dc=chip('expression = using the gene’s information',1280,928,'amber',{fs:28});
// 2 regulation panel
const names=['gene A','gene B','gene C','gene D'];const rowY=i=>490+i*100;
const rlab=names.map((n,i)=>ctx('font:600 28px Inter;color:'+INK,n,820,rowY(i)+6,140));
const trk=names.map((n,i)=>{const b=box('',900,rowY(i),880,46);b.style.cssText+=';background:#eef3f0;border:3px solid #cdd9d3;border-radius:23px;opacity:0';return b});
const fil=names.map((n,i)=>{const b=box('',903,rowY(i)+3,10,40);b.style.cssText+=`;background:${['#4d8f7e','#557eaf','#8b75b0','#cf8a83'][i]};border-radius:20px;opacity:0`;return b});
const lvl=[t=>Math.max(0,Math.sin(t*.9+.3)),t=>.25+.2*Math.sin(t*1.3),t=>Math.max(0,Math.sin(t*.6+2.1)*1.0),t=>.8*(.5+.5*Math.sin(t*1.5+1))];
const wc=chip('when',830,935,'mint',{fs:28}),hc=chip('how much',1000,935,'lav',{fs:28}),pc=chip('✗  not every gene permanently on at the same level',1500,935,'coral',{fs:26});
// 3 two cells
const ca=ico('animal-cell',990,640,240),cb=ico('animal-cell',1590,640,240,{css:'filter:hue-rotate(75deg) saturate(1.15)'});
const eq=chip('very similar DNA',1290,640,'blue',{fs:28});const eqs=ctx('font:700 70px/1 Poppins;color:'+BLU,'≈',1290,540,100);
const mb=[0,1].map(k=>[0,1,2,3].map(i=>{const b=box('',(k?1490:890)+i*52,0,40,10);b.style.cssText+=`;background:${k?'#cf8a83':'#7f9fc9'};border-radius:8px 8px 0 0;transform-origin:bottom;opacity:0`;return b}));
const PA=[110,40,90,60],PB=[40,100,50,110];
const dcc=chip('they use the information differently',1290,930,'amber',{fs:28});
// 4 same cell new conditions
const cs=ico('animal-cell',1280,610,250);const bs=[0,1,2,3,4].map(i=>{const b=box('',1050+i*70,0,48,10);b.style.cssText+=';background:#4d8f7e;border-radius:8px 8px 0 0;transform-origin:bottom;opacity:0';return b});
const PX=[100,40,120,60,30],PY=[40,110,50,120,90];
const cc1=chip('condition 1',1180,890,'blue',{fs:28}),cc2=chip('new condition',1180,890,'coral',{fs:28});
const ca1=WB.svg('path',{d:'M1150 620 L 1010 620',stroke:COR,'stroke-width':0},svB);
// 5 measurement
const mh=ico('expression-heatmap',1640,610,300);const mcc=chip('RNA measurement',1640,800,'lav',{fs:28});
const mar=WB.svg('path',{d:'M1440 640 L 1510 640',stroke:LAV,'stroke-width':8,fill:'none','stroke-linecap':'round','marker-end':'url(#arp)'},svB);
// 6 RNA -> protein
const rr=ico('rna-strand',840,650,200),rpp=ico('folded-protein',1700,650,200);
const rbar=box('',950,760,50,0);rbar.style.cssText+=';background:#8b75b0;border-radius:10px 10px 0 0;opacity:0';
const nodes=[0,1,2].map(i=>{const e=box('',1120+i*160,610,80,80);e.style.cssText+=`;border-radius:50%;background:#fff;border:6px solid #e0a43a;opacity:0;font:700 26px/68px Poppins;text-align:center;color:${INK}`;e.textContent=['step','control','step'][i].charAt(0).toUpperCase();return e});
const nl=['step','control','step'].map((n,i)=>ctx('font:600 24px Inter;color:'+MUT,n,1160+i*160,700,140));
const pth=WB.svg('path',{d:'M960 650 L 1660 650',stroke:'#cdd9d3','stroke-width':10,fill:'none','stroke-linecap':'round'},svB);
const dots=[0,1,2,3,4].map(i=>WB.svg('circle',{r:13,fill:'#8b75b0',stroke:'#fff','stroke-width':4},svB));
const neq=ctx('font:700 100px/1 Poppins;color:'+COR,'≠',1280,790,120);
const rcl=chip('more RNA',840,830,'lav',{fs:28}),pcl=chip('more active protein?',1700,830,'mint',{fs:28}),scl=chip('several steps and controls lie between',1280,935,'amber',{fs:28});
// 7 simple distinction
const KX=[740,1118,1496],KW=350;
const kc=[['b-blue','DNA records information','dna-helix',150],['b-lav','expression concerns its use','expression-heatmap',250],['b-amber','an experiment captures one view of the state','well-plate',250]].map(([cls,tt,ik,iw],i)=>({bx:box(cls,KX[i],520,KW,380),t:ctx('font:700 28px/1.2 Poppins;color:'+INK,tt,KX[i]+KW/2,770,KW-30),ic:ico(ik,KX[i]+KW/2,640,iw)}));
return function update(t){
  const A=k=>c(k);
  lh.set({op:out(t,A('c_def'),.9),s:.9+.1*out(t,A('c_def'),.9),y:track(Math.sin(t*1.3)*8)});life(lc,t,A('c_def')+.4,null);
  notes.update(t);
  // 1
  const e1=A('c_reg')-.3;const bi=out(t,A('c_def')+.1,1.0);
  bar.style.opacity=bi*(1-out(t,e1,.4));bar.style.transform=`scaleX(${bi.toFixed(3)})`;life(g1,t,A('c_def')+.9,e1,{dy:0});life(gcp,t,A('c_def')+1.0,e1,{dy:8});
  pathGrow(d1,out(t,A('c_def')+2.0,.7));pathGrow(d2,out(t,A('c_def')+3.0,.7));d1.style.opacity=win(t,A('c_def')+2.0,e1,.1);d2.style.opacity=win(t,A('c_def')+3.0,e1,.1);
  [c1,t1].forEach(e=>life(e,t,A('c_def')+2.6,e1,{dy:20}));[c2,t2].forEach(e=>life(e,t,A('c_def')+3.4,e1,{dy:20}));
  i1.set({op:win(t,A('c_def')+2.8,e1,.5),s:.7+.3*out(t,A('c_def')+2.8,.6),y:track(Math.sin(t*1.6)*5)});i2.set({op:win(t,A('c_def')+3.6,e1,.5),s:.7+.3*out(t,A('c_def')+3.6,.6),y:track(Math.sin(t*1.6+1)*5)});
  life(dc,t,A('c_def')+4.4,e1,{dy:8});
  // 2
  const s2=A('c_reg'),e2=A('c_two')-.3;
  rlab.forEach((e,i)=>life(e,t,s2+.1*i,e2,{dy:8}));trk.forEach((b,i)=>{const p=out(t,s2+.1*i,.4);b.style.opacity=p*(1-out(t,e2,.4))});
  fil.forEach((b,i)=>{const p=out(t,s2+.4+.1*i,.4);const lv=lvl[i](track(t*1.0));b.style.opacity=p*(1-out(t,e2,.4));b.style.width=(10+864*Math.max(0,Math.min(1,lv)))+'px'});
  life(wc,t,A('c_when')-.1,e2,{dy:8});life(hc,t,A('c_when')+.7,e2,{dy:8});life(pc,t,A('c_perm')+.3,e2,{dy:8});
  // 3
  const s3=A('c_two'),e3=A('c_same')-.3;
  ca.set({op:win(t,s3,e3,.6),s:.85+.15*out(t,s3,.7),y:track(Math.sin(t*1.4)*4)});cb.set({op:win(t,s3+.5,e3,.6),s:.85+.15*out(t,s3+.5,.7),y:track(Math.sin(t*1.4+1)*4)});
  life(eq,t,s3+1.3,e3,{dy:8});life(eqs,t,s3+1.3,e3,{dy:8});
  mb.forEach((arr,k)=>arr.forEach((b,i)=>{const h=(k?PB:PA)[i];const g=out(t,A('c_diffuse')+.1*i+k*.4,.6);b.style.height=(h*g)+'px';b.style.top=(840-h*g)+'px';b.style.opacity=g*(1-out(t,e3,.4))}));
  life(dcc,t,A('c_diffuse')+.8,e3,{dy:8});
  // 4
  const s4=A('c_same'),e4=A('c_rnam')-.3;
  cs.set({op:win(t,s4,A('c_more')-.3,.6),s:.85+.15*out(t,s4,.7),y:track(Math.sin(t*1.4)*4)});
  const sw=out(t,s4+2.4,1.6);
  bs.forEach((b,i)=>{const g=out(t,s4+.3+.1*i,.5);const h=mix(PX[i],PY[i],sw);b.style.height=(h*g)+'px';b.style.top=(840-h*g)+'px';b.style.opacity=g*(1-out(t,A('c_more')-.3,.4));b.style.background=sw>.5?'#cf8a83':'#4d8f7e'});
  life(cc1,t,s4+.4,s4+2.4,{dy:8});life(cc2,t,s4+2.6,A('c_more')-.3,{dy:8});
  // 5
  mh.set({op:win(t,A('c_rnam'),A('c_more')-.3,.6),s:.85+.15*out(t,A('c_rnam'),.7),y:track(Math.sin(t*1.5)*5)});life(mcc,t,A('c_rnam')+.4,A('c_more')-.3,{dy:8});
  mar.style.opacity=win(t,A('c_rnam')+.2,A('c_more')-.3,.3);
  // 6
  const s6=A('c_more'),e6=A('c_keep')-.3;
  rr.set({op:win(t,s6,e6,.6),s:.8+.2*out(t,s6,.7),y:track(Math.sin(t*1.4)*5)});rpp.set({op:win(t,s6+.6,e6,.6),s:.8+.2*out(t,s6+.6,.7),y:track(Math.sin(t*1.4+1)*5)});
  pth.style.opacity=win(t,s6+.3,e6,.4);
  nodes.forEach((e,i)=>{const p=out(t,A('c_steps')-.2+.3*i,.4);e.style.opacity=p*(1-out(t,e6,.4));e.style.transform=`scale(${(.5+.5*p).toFixed(3)})`});nl.forEach((e,i)=>life(e,t,A('c_steps')+.1+.3*i,e6,{dy:6}));
  dots.forEach((d,i)=>{const q=track(((t-s6-.8)*.25+i/5)%1);const x=960+700*q;d.setAttribute('cx',x);d.setAttribute('cy',650);const lose=out(t,A('c_steps'),1)*Math.min(1,Math.max(0,(q-.35)*2.4));const keep=i==2||i==4?0:lose;d.style.opacity=out(t,s6+.8,.4)*(1-keep)*(1-out(t,e6,.4))*(Math.sin(Math.PI*q)>.15?1:Math.sin(Math.PI*q)/.15)});
  life(rcl,t,s6+.3,e6,{dy:8});life(pcl,t,s6+1.0,e6,{dy:8});life(scl,t,A('c_steps')+.2,e6,{dy:8});neq.style.opacity=win(t,A('c_steps')+1.0,e6,.5);
  // 7
  const ks=[A('c_dna')-.1,A('c_expr')-.1,A('c_expt')-.1];
  kc.forEach((k,i)=>{life(k.bx,t,ks[i],null,{dy:20});life(k.t,t,ks[i]+.2,null,{dy:8});k.ic.set({op:out(t,ks[i]+.1,.5),s:.8+.2*out(t,ks[i]+.1,.6),y:track(Math.sin(t*1.5+i)*5)})});
};});
</script></body></html>
