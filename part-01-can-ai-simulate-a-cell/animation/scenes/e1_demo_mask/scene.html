<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/wb.css"></head>
<body><div id="canvas"></div>
<script src="../../lib/wb.js"></script><script src="../../lib/codecard.js"></script>
<script>
SCENE_INIT({ep:1,part:4,partTitle:'The real ESM-2 experiment',title:'Hide one amino acid, predict it',foot:'Actual local ESM-2 t6_8M run · frozen checkpoint · probabilities from results.json · scores drawn on a schematic scale'},(S,C)=>{
const {el,at,show,out,mix,svg,lin}=WB;const K=C;const INK='#183b32',MUT='#60716a',BLU='#557eaf',GRN='#26765d',COR='#b76d66',AMB='#a65647';
function box(cls,x,y,w,h){const b=el('div','box '+cls);at(b,x,y,w,h);return b}
function tx(css,html,x,y,w){const e=el('div','t');e.style.cssText+=';'+css;e.innerHTML=html;at(e,x,y,w);return e}
const code=CODECARD(S,{x:1210,y:222,w:630,h:520,title:'esm2_demo.py · analyze_window',sub:'real source lines 99–109',lines:K.code,fs:20,lh:30,cpl:46,measure:true});
const nBox=box('b-amber',1210,764,630,200);
const NOTES=[
 ['Pick one position and hide it.',K.c_hide,K.c_rep],
 ['Swap its token for the special <b>&lt;mask&gt;</b> symbol.',K.c_rep,K.c_vis],
 ['The rest of the window stays visible as <b>context</b>.',K.c_vis,K.c_fwd],
 ['Forward pass: the model gives <b>one score per symbol</b> it can output.',K.c_fwd,K.c_voc],
 ['<b>Vocabulary</b> = every symbol the model can predict: 20 amino acids + 13 special or rare symbols.',K.c_voc,K.c_nop],
 ['Raw scores are <b>not probabilities</b> yet.',K.c_nop,K.c_soft],
 ['<b>Softmax</b> turns scores into probabilities that add up to 1.',K.c_soft,K.c_big],
 ['A bigger score always gives a <b>bigger probability</b>.',K.c_big,K.c_file],
 ['The output file keeps the probabilities over the <b>full vocabulary</b>.',K.c_file,K.c_20],
 ['It also marks the <b>20 standard amino acids</b> — they hold 99.995 % of the probability.',K.c_20,K.c_matt],
 ['Re-normalising over just those 20 changes the numbers slightly.',K.c_matt,K.c_lab],
 ['The notebook <b>labels both quantities</b> so they never get mixed up.',K.c_lab,K.c_insp],
 ['Next: the real values for <b>C</b> (cysteine) and <b>S</b> (serine).',K.c_insp,999]];
const nts=NOTES.map(([h,a,b])=>{const e=tx('font:600 29px/1.3 Inter;color:'+INK+';white-space:normal',h,1236,790,580);return {e,a,b}});
// ---------------- masking row
const SX=100,CW=80,TI=6,RY=252,RH=66;
const seq=K.seq,I0=24;const ctx=[...seq.slice(I0,I0+13)];
const cells=ctx.map((a,i)=>{const c=box('b-blue',SX+i*CW,RY,CW-6,RH);c.style.cssText+=`;border-radius:14px;font:700 32px/${RH}px Poppins;text-align:center;color:${INK}`;c.textContent=a;return c});
const tcx=SX+TI*CW;
const tgtRing=box('',tcx-5,RY-5,CW-6+10,RH+10);tgtRing.style.cssText+=';border:4px dashed #e0a43a;border-radius:18px';
const tgtLbl=tx('font:700 24px/1 Poppins;color:'+AMB+';text-align:center;width:260px','chosen position 797',tcx-90,RY-36);
const maskC=box('b-coral',tcx,RY,CW-6,RH);maskC.style.cssText+=`;border-radius:14px;font:700 17px/${RH-6}px Poppins;text-align:center;color:${AMB};border:3px solid ${COR};background:#fde5e1`;maskC.textContent='<mask>';
const qm=tx('font:700 24px/1 Poppins;color:'+AMB,'?',tcx+CW/2-10,RY+RH+8);
function bk(x,w,col,y,h){const b=box('',x,y,w,h||14);b.style.cssText+=`;border:4px solid ${col};border-top:0;border-radius:0 0 10px 10px;box-sizing:border-box`;return b}
const bkL=bk(SX,TI*CW-6,'#4d8f7e',330),bkR=bk(SX+(TI+1)*CW,(12-TI)*CW-6,'#4d8f7e',330);
const lbL=tx('font:600 24px/1 Inter;color:'+GRN+';text-align:center;width:'+(TI*CW-6)+'px','visible context (left)',SX,352);
const lbR=tx('font:600 24px/1 Inter;color:'+GRN+';text-align:center;width:'+((12-TI)*CW-6)+'px','visible context (right)',SX+(TI+1)*CW,352);
// ---------------- model box + arrows
const model=box('b-blue',417,392,400,60);model.style.cssText+=`;border-radius:16px;font:700 27px/60px Poppins;text-align:center;color:${INK}`;model.textContent='ESM-2 · forward pass';
const ar1=box('',tcx+CW/2-5,RY+RH+34,4,36);ar1.style.background='#4d8f7e';const ar1h=tx('font:700 26px/1 Inter;color:#4d8f7e','▼',tcx+CW/2-16,RY+RH+62);
const ar2=box('',tcx+CW/2-5,452,4,18);ar2.style.background='#4d8f7e';
// ---------------- chart
const ORD='LAGVSERTIDPKQNFYMHWC';const BYL=780,HH=240;
const lnp=[...ORD].map(a=>Math.log(K.probs[a]));const lmax=Math.max(...lnp);
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mb(11);
const lnoth=[...Array(13)].map(()=>-12.4+(rnd()-.5)*1.8);
const SHIFT=13.5,DEN=lmax+SHIFT;
const pOth=(1-K.mass20)/13;
const bars=[];
ORD.split('').forEach((a,i)=>{const x=SX+i*36;const b=box('',x,BYL-10,30,10);b.style.cssText+=';background:#7fa4cf;border-radius:5px 5px 0 0';
  const lab=tx('font:700 24px/1 Poppins;color:'+INK+';text-align:center;width:30px',a,x,BYL+8);
  bars.push({b,lab,a,x,w:30,hs:HH*(lnp[i]+SHIFT)/DEN,hp:HH*K.probs[a]/K.probs.L,i,aa:true})});
lnoth.forEach((l,j)=>{const x=850+j*24;const b=box('',x,BYL-10,18,10);b.style.cssText+=';background:#e3a7a0;border-radius:4px 4px 0 0';
  bars.push({b,lab:null,a:'o'+j,x,w:18,hs:Math.max(3,HH*(l+SHIFT)/DEN),hp:1.5,i:20+j,aa:false})});
const base=box('',SX-6,BYL,1080,3);base.style.background='#9fb3ab';
const cap1=tx('font:600 26px/1.2 Inter;color:'+INK,'scores · one per symbol (schematic scale)',SX,468,500);
const cap2=tx('font:600 26px/1.2 Inter;color:'+INK,'probabilities · real values from this run',SX,468,500);
// chart groups (bottom)
const gB1=bk(SX,20*36-6,GRN,826),gB2=bk(850,13*24-6,COR,826);
const gL1=tx('font:700 25px/1.15 Inter;color:'+GRN+';text-align:center;width:'+(20*36-6)+'px','20 standard amino acids',SX,846);
const gL2=tx('font:700 24px/1.15 Inter;color:'+AMB+';text-align:center;width:'+(13*24-6)+'px','13 special &amp; rare symbols',850,846);
const gN1=tx('font:600 24px/1.15 Inter;color:'+GRN+';text-align:center;width:'+(20*36-6)+'px','99.995 % of the probability',SX,876);
const gN2=tx('font:600 24px/1.15 Inter;color:'+AMB+';text-align:center;width:'+(13*24-6)+'px','0.005 % together',850,876);
const vB=bk(SX,1062,'#8aa59b',912,12);
const vL=tx('font:600 25px/1.2 Inter;color:'+MUT+';text-align:center;width:1062px','vocabulary = every symbol the model can predict (33)',SX,930);
// chips (right area above the short coral bars)
function chip(cls,html,x,y,w,h){const c=box(cls,x,y,w,h);const t=tx('font:700 26px/1.25 Inter;color:'+INK+';white-space:normal;text-align:center','<div>'+html+'</div>',x+16,y);t.style.cssText+=`;display:flex;align-items:center;justify-content:center;height:${h}px;top:${y}px`;t.style.width=(w-32)+'px';return {c,t}}
const chNop=chip('b-coral','Scores have<br><span style="font-weight:500">no fixed total</span>',862,520,296,110);
const smx=tx('font:700 27px/1 Poppins;color:#fff;background:'+GRN+';border-radius:24px;padding:10px 22px','softmax ↓',650,456);
const chSum=chip('b-mint','Sum of all bars = 1<br><span style="font-weight:500">(100 %)</span>',862,520,296,100);
const chBig=chip('b-amber','Bigger score →<br><span style="font-weight:500">bigger probability</span>',862,640,296,100);
// tags on bars
function tag(html,x,y,col,w){const e=tx('font:700 24px/1 Poppins;color:#fff;background:'+col+';border-radius:12px;padding:7px 12px;text-align:center;white-space:nowrap',html,x,y);return e}
const tagL=tag('L · 8.8 %',SX-4,0,BLU),tagW=tag('W · 1.5 %',SX+18*36-40,0,'#6b7f78');
const bC=bars[19],bS=bars[4];
const tagC=tag('C · 1.72 %',bC.x-58,0,COR),tagS=tag('S · 7.35 %',bS.x-40,0,GRN);
// chips A/B (file contents)
function fch(cls,name,sub,vals,x,y,w,h){const c=box(cls,x,y,w,h);const t1=tx('font:700 22px/1 "DejaVu Sans Mono",monospace;color:'+INK+';white-space:nowrap',name+' <span style="font:500 21px Inter;color:'+MUT+'">'+sub+'</span>',x+18,y+14);const t2=tx('font:700 32px/1 Poppins;color:'+INK+';white-space:nowrap',vals,x+18,y+48);return {c,t1,t2}}
const cA=fch('b-blue','probability','· all 33 symbols','<span style="color:'+COR+'">C 1.7150 %</span> &nbsp;<span style="color:'+GRN+'">S 7.3511 %</span>',100,360,510,96);
const cB=fch('b-mint','aa_conditional','· 20 amino acids only','<span style="color:'+COR+'">C 1.7151 %</span> &nbsp;<span style="color:'+GRN+'">S 7.3515 %</span>',650,360,510,96);
const div=tx('font:700 24px/1 Poppins;color:#fff;background:'+AMB+';border-radius:18px;padding:7px 14px;white-space:nowrap','÷ 0.99995',1030,338);
const neq=tx('font:700 34px/42px Poppins;color:#fff;background:#6b7f78;border-radius:50%;width:42px;height:42px;text-align:center','≠',609,383);
const fileTag=tx('font:600 22px/1 Inter;color:'+MUT,'saved in the output file',100,334);
return function update(t){
  code.update(t,out(t,.1,.7));
  show(nBox,t,.1,.6);nts.forEach(n=>{const a=out(t,n.a,.4)*(1-out(t,n.b,.4));n.e.style.opacity=a;n.e.style.transform=`translateY(${((1-a)*8).toFixed(1)}px)`});
  // masking row
  cells.forEach((c,i)=>{const isT=i==TI;const a=show(c,t,.2+i*.06,.5,{dy:8});
    if(isT){const r=out(t,K.c_rep,.5);c.style.opacity=a*(1-r)}
    else{const dim=out(t,K.c_vis,.5);c.style.boxShadow=`0 0 0 ${(3*dim).toFixed(1)}px rgba(77,143,126,${(.55*dim).toFixed(2)})`}});
  show(tgtLbl,t,K.c_hide,.6,{dy:6});
  const ring=out(t,K.c_hide,.5)*(1-out(t,K.c_rep+.8,.5));tgtRing.style.opacity=ring;
  show(maskC,t,K.c_rep,.6,{dy:0,scale:.7});show(qm,t,K.c_vis,.5,{dy:4});
  const cx=out(t,K.c_vis,.6)*(1-out(t,K.c_fwd+.2,.5));
  [bkL,bkR,lbL,lbR].forEach(e=>{e.style.opacity=cx});
  // model
  const mo=out(t,K.c_fwd,.6)*(1-out(t,K.c_soft,.6)*(t<K.c_file?1:0));
  const mf=(1-out(t,K.c_soft+.4,.6));
  [model,ar1,ar1h,ar2].forEach(e=>{show(e,t,K.c_fwd,.6,{dy:0});e.style.opacity=out(t,K.c_fwd,.6)*mf});
  // bars
  const mm=out(t,K.c_soft+1.0,2.6);
  bars.forEach(o=>{const g=out(t,K.c_fwd+1.5+o.i*.045,.6);const h=mix(o.hs,o.hp,mm)*g;let op=g;
    const insp=out(t,K.c_insp,.6);
    if(insp>0){const keep=(o.a=='C'||o.a=='S')?1:0;op=g*mix(1,keep?1:.25,insp)}
    if(o.aa&&o.a=='C'){o.b.style.background=mix2('#7fa4cf',COR,out(t,K.c_insp,.6))}
    if(o.aa&&o.a=='S'){o.b.style.background=mix2('#7fa4cf',GRN,out(t,K.c_insp,.6))}
    o.b.style.top=(BYL-h)+'px';o.b.style.height=h+'px';o.b.style.opacity=op;if(o.lab)o.lab.style.opacity=op});
  base.style.opacity=out(t,K.c_fwd+1.3,.5);
  cap1.style.opacity=out(t,K.c_fwd+1.5,.6)*(1-out(t,K.c_soft+1.0,.5));
  cap2.style.opacity=out(t,K.c_soft+1.6,.6);
  show(smx,t,K.c_soft,.5,{dy:0});smx.style.opacity=out(t,K.c_soft,.5)*(1-out(t,K.c_big,.5));
  // vocab + groups
  const vv=out(t,K.c_voc,.6);vB.style.opacity=vv;vL.style.opacity=vv;
  const gg=out(t,K.c_incl,.6);[gB1,gB2,gL1,gL2].forEach(e=>e.style.opacity=gg);
  const gn=out(t,K.c_20,.6);[gN1,gN2].forEach(e=>e.style.opacity=gn);
  // chips on right
  const cn=out(t,K.c_nop,.5)*(1-out(t,K.c_soft,.4));[chNop.c,chNop.t].forEach(e=>e.style.opacity=cn);
  const cs=out(t,K.c_soft+4.0,.5)*(1-out(t,K.c_file,.4));[chSum.c,chSum.t].forEach(e=>e.style.opacity=cs);
  const cbg=out(t,K.c_big,.5)*(1-out(t,K.c_file,.4));[chBig.c,chBig.t].forEach(e=>e.style.opacity=cbg);
  // tags on bars (positions follow bar tops)
  const place=(tg,o,off)=>{const h=mix(o.hs,o.hp,mm);tg.style.top=(BYL-h-off)+'px'};
  place(tagL,bars[0],42);place(tagW,bars[18],42);
  const tl=out(t,K.c_big+.6,.5)*(1-out(t,K.c_file,.4));tagL.style.opacity=tl;tagW.style.opacity=tl;
  place(tagC,bC,42);place(tagS,bS,42);
  const ti=out(t,K.c_insp+.5,.6);tagC.style.opacity=ti;tagS.style.opacity=ti;
  // file chips
  show(fileTag,t,K.c_file,.5,{dy:6});show(cA.c,t,K.c_file,.6);show(cA.t1,t,K.c_file,.6);show(cA.t2,t,K.c_file+.2,.6);
  show(cB.c,t,K.c_matt+.4,.6);show(cB.t1,t,K.c_matt+.4,.6);show(cB.t2,t,K.c_matt+.8,.6);show(div,t,K.c_matt+1.4,.5,{dy:0});
  show(neq,t,K.c_lab,.5,{dy:0,scale:.5});
  const emph=out(t,K.c_insp,.6);
  [cA.c,cB.c].forEach(c=>c.style.boxShadow=`0 0 0 ${(4*emph).toFixed(1)}px rgba(224,164,58,${(.7*emph).toFixed(2)})`);
  return 0;
};
function mix2(a,b,p){const pa=a.match(/\w\w/g).map(h=>parseInt(h,16)),pb=b.match(/\w\w/g).map(h=>parseInt(h,16));return 'rgb('+pa.map((v,i)=>Math.round(v+(pb[i]-v)*p)).join(',')+')'}
});
</script></body></html>
