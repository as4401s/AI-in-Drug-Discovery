<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/wb.css"></head>
<body><div id="canvas"></div>
<script src="../../lib/wb.js"></script>
<script>
SCENE_INIT({ep:1,part:3,partTitle:'How models learn',title:'Work through two numbers',foot:'WhiskerBrief teaching example · concepts and worked mathematics'},(S,C)=>{
const {el,at,show,out,mix}=WB;
const c=Object.assign({},C);for(const k in c)c[k]=Math.max(c[k],0.1);
function box(cls,x,y,w,h){const b=el('div','box '+cls);at(b,x,y,w,h);return b}
function tx(css,html,x,y){const e=el('div','t');e.style.cssText+=';'+css;e.innerHTML=html;at(e,x,y);return e}
const cards=[];
function card(x,cls,name,p,pcol,resCol,res,formula,pentxt){
  const o={x,p,res};
  o.box=box(cls,x,252,850,420);
  o.lab=tx('font:500 28px/1 Inter;color:#60716a',name,x+34,276);
  o.bg=box('',x+34,326,782,50);o.bg.style.cssText+=';background:#fff;border:3px solid #cfd9e6;border-radius:14px';
  o.fill=box('',x+34,326,782*p,50);o.fill.style.cssText+=`;background:${pcol};border-radius:14px`;
  o.plab=tx('font:700 66px/1 Poppins;color:#183b32;letter-spacing:-1px','p = '+p.toFixed(2),x+34,404);
  o.pnote=tx('font:400 26px/1.2 Inter;color:#60716a','probability of the correct answer',x+330,436);
  o.form=tx('font:600 44px/1 Inter;color:#183b32',formula,x+34,508);
  o.resv=tx(`font:700 104px/1 Poppins;color:${resCol};letter-spacing:-2px`,'≈ '+res.toFixed(3),x+34,556);
  o.pbg=box('',x+460,590,356,56);o.pbg.style.cssText+=';background:#fff;border:3px solid #ecd2cf;border-radius:14px';
  o.pbar=box('',x+460,590,Math.min(356,res*200),56);o.pbar.style.cssText+=`;background:${resCol};border-radius:14px`;
  o.pt=tx('font:500 24px/1 Inter;color:#60716a','penalty',x+460,652);
  o.badge=el('div','pill','');o.badge.style.cssText+=';font-size:28px;padding:10px 24px;font-weight:600';at(o.badge,x+520,262);
  return o;
}
const A=card(80,'b-blue','Prediction A',.20,'#557eaf','#a65647',1.609,'loss = −ln(0.20)');
const B=card(990,'b-mint','Prediction B',.80,'#4d8f7e','#26765d',0.223,'loss = −ln(0.80)');
A.badge.innerHTML='larger loss';A.badge.style.background='#fbe6e3';A.badge.style.color='#a65647';
B.badge.innerHTML='✓ smaller loss';B.badge.style.background='#fff';B.badge.style.color='#26765d';
cards.push(A,B);
// bottom strip : several positions
const S2=[];
function chip(x,cls,html){const b=el('div','box '+cls,html);at(b,x,712,330,120);b.style.cssText+=';padding:22px 24px;font:500 28px/1.3 Inter;color:#183b32';return b}
const ch=[chip(80,'b-coral','hidden position 1<br><b style="font:700 40px Poppins">1.609</b>'),chip(450,'b-mint','hidden position 2<br><b style="font:700 40px Poppins">0.223</b>'),chip(820,'b-lav','hidden position 3<br><b style="font:700 40px Poppins;color:#60716a">…</b>')];
const plus=[0,1].map(i=>{const e=tx('font:500 56px/1 Inter;color:#60716a','+',410+i*370,742);return e});
const arrow=tx('font:500 70px/1 Inter;color:#26765d','→',1180,735);
const comb=el('div','box b-amber','');at(comb,1290,712,550,120);comb.innerHTML='<div style="padding:18px 28px;font:700 40px/1.15 Poppins;color:#183b32">sum or average<div style="font:400 26px Inter;color:#60716a;margin-top:6px">→ one training loss</div></div>';
const sNote=tx('font:400 25px/1 Inter;color:#60716a','illustrative: the third position is not computed here',80,850);
// final banner
const fin=el('div','box b-lav','');at(fin,80,712,1760,246);
fin.innerHTML='<div style="padding:30px 44px"><div style="font:500 28px/1 Inter;color:#60716a">The core instruction</div><div style="font:700 54px/1.18 Poppins;color:#183b32;margin-top:16px;letter-spacing:-1px">Measure how much probability the model gave to the answers it was supposed to recover.</div></div>';
const eqs=tx('font:600 34px/1 Inter;color:#183b32;background:#fff;border-radius:16px;padding:14px 26px','loss = <span style="color:#a65647">−ln</span> p(<span style="color:#26765d">correct</span> | <span style="color:#557eaf">context</span>)',1210,874);
return function update(t){
  cards.forEach((o,i)=>{
    const t0=i?.45:.15;
    [o.box,o.lab,o.bg,o.plab,o.pnote].forEach(e=>show(e,t,t0,.6,{dy:12}));
    show(o.fill,t,t0,.6,{dy:12});o.fill.style.width=(782*o.p*WB.out(t,t0+.2,1.0))+'px';
    const k=i?c.c_b:c.c_a;
    show(o.form,t,k-.1,.6,{dy:10});
    [o.resv,o.pbg,o.pt].forEach(e=>show(e,t,k+.7,.6,{dy:10}));show(o.pbar,t,k+.7,.4,{dy:0});
    o.pbar.style.width=(Math.min(356,o.res*200)*WB.out(t,k+.9,1.1))+'px';
  });
  show(A.badge,t,c.c_smaller+.7,.5,{dy:0});show(B.badge,t,c.c_smaller,.5,{dy:0});
  const sev=WB.out(t,c.c_several-.2,.7), fadeS=1-WB.out(t,c.c_compact-.3,.7);
  ch.forEach((e,i)=>{show(e,t,c.c_several+i*.9,.6,{dy:12});e.style.opacity=parseFloat(e.style.opacity)*fadeS});
  plus.forEach((e,i)=>{show(e,t,c.c_several+.6+i*.9,.4,{dy:0});e.style.opacity=parseFloat(e.style.opacity)*fadeS});
  show(arrow,t,c.c_sum-.5,.5,{dy:0});arrow.style.opacity*=fadeS;
  show(comb,t,c.c_sum-.3,.6,{dy:10});comb.style.opacity*=fadeS;
  show(sNote,t,c.c_several+2,.5,{dy:0});sNote.style.opacity*=fadeS;
  show(fin,t,c.c_compact+.1,.7,{dy:12});show(eqs,t,c.c_measure,.6,{dy:8});
  // dim the two cards a bit once the formula banner takes over
  const dim=1-.0*WB.out(t,c.c_compact,1);
};
});
</script></body></html>
