<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/wb.css"></head>
<body><div id="canvas"></div>
<script src="../../lib/wb.js"></script>
<script>
SCENE_INIT({ep:1,part:3,partTitle:'How models learn',title:'Training · learning from examples',foot:'Training and held-out evaluation · Google ML education'},(S,C)=>{
const {el,at,show,out,ramp,mix,svg,lin}=WB;const clamp=WB.clamp;const c=C;
function box(cls,x,y,w,h){const b=el('div','box '+cls);at(b,x,y,w,h);return b}
function tx(css,html,x,y,w){const e=el('div','t');e.style.cssText+=';'+css;e.innerHTML=html;at(e,x,y,w);return e}
const INK='#183b32',MUT='#60716a';
const ALL=[];   // loop elements, faded together at the task hand-off
function reg(e){ALL.push(e);return e}
// ---------- arrows layer
const sv=svg('svg',{width:1920,height:1080,style:'position:absolute;left:0;top:0'},S);
const defs=svg('defs',{},sv);const mk=svg('marker',{id:'ah',viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:5.5,markerHeight:5.5,orient:'auto'},defs);svg('path',{d:'M0 0L10 5L0 10z',fill:'#26765d'},mk);
const AR=[ // A1 input->model, A2 model->pred, A3 pred->loss, A4 target->loss, A5 loss->opt, A6 opt->model
 [266,395,326,395],[740,395,844,395],[1040,506,1040,594],[1040,856,1040,796],[846,695,736,695],[530,596,530,558]];
const arrows=AR.map(([x1,y1,x2,y2])=>reg(svg('path',{d:`M${x1} ${y1} L${x2} ${y2}`,stroke:'#26765d','stroke-width':6,fill:'none','marker-end':'url(#ah)','stroke-linecap':'round'},sv)));
// ---------- cards
const card=(cls,x,y,w,h,title,sub,tcol)=>{const b=reg(box(cls,x,y,w,h));const t=reg(tx('font:700 40px/1 Poppins;color:'+(tcol||INK),title,x+28,y+22));const s=sub?reg(tx('font:400 26px/1.3 Inter;color:'+MUT,sub,x+28,y+78)):null;return {b,t,s,x,y,w,h}};
const mdl=card('b-lav',330,250,400,300,'Model','makes the prediction');
// sliders (parameters)
const SL=[[394,.22,.72],[440,.70,.28],[486,.35,.80]]; // y, start pos, final pos
const sl=SL.map(([y,p0,p1])=>{const tr=reg(box('',365,y,330,10));tr.style.cssText+=';background:#cdbfea;border-radius:5px';
  const kn=reg(box('',0,y-9,28,28));kn.style.cssText+=';background:#7a62a8;border:4px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(60,40,100,.35)';return {tr,kn,y,p0,p1}});
const parLab=reg(tx('font:600 27px/1 Inter;color:#5d4a8a','parameters = adjustable numbers',358,514));
const inp=card('b-blue',80,330,180,130,'Input',null);inp.t.style.left='100px';
const inpS=reg(tx('font:400 24px/1.25 Inter;color:'+MUT,'from one<br>training example',100,396));
const prd=card('b-mint',850,290,380,210,'Prediction','the model’s answer<br>for this input');
const los=card('b-amber',850,600,380,190,'Loss',null);
const losS=reg(tx('font:400 26px/1.3 Inter;color:'+MUT,'one number: how far off?',878,672));
const losN=reg(tx('font:700 62px/1 Poppins;color:#8a6b1f','1.82',878,705));
const losI=reg(tx('font:400 23px/1 Inter;color:'+MUT,'illustrative',1048,740));
const opt=card('b-blue',330,600,400,190,'Optimizer','uses the loss to decide<br>how to adjust the parameters');
const tgt=card('b-coral',850,860,380,110,'Target answer',null);tgt.t.style.fontSize='34px';tgt.t.style.top=(860+16)+'px';
const tgtS=reg(tx('font:400 26px/1.2 Inter;color:'+MUT,'known for this example',878,918));
const adjLab=reg(tx('font:500 24px/1 Inter;color:#26765d','small adjustment',548,566));
// repeat badge
const rep=reg(box('b-mint',80,620,210,170));
const repT=reg(tx('font:700 34px/1 Poppins;color:'+INK,'Repeat',104,640));
const repI=reg(tx('font:400 56px/1 Inter;color:#26765d','↻',104,690));
const repN=reg(tx('font:600 26px/1.2 Inter;color:'+INK,'update 0',104,752));
// dots
const dots=AR.map(()=>{const d=reg(box('',0,0,24,24));d.style.cssText+=';background:#26765d;border:4px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.3);opacity:0';return d});
function dot(i,p){const d=dots[i],[x1,y1,x2,y2]=AR[i];const q=clamp(p);d.style.left=(mix(x1,x2,q)-12)+'px';d.style.top=(mix(y1,y2,q)-12)+'px';d.style.opacity=(p>0&&p<1)?1:0}
const LP=el('div','',null);LP.style.cssText='position:absolute;left:0;top:0;width:1920px;height:1080px';
LP.appendChild(sv);ALL.filter(e=>e instanceof HTMLElement).forEach(e=>LP.appendChild(e));
// ---------- right-hand panel : loss over updates + data split
const PNL=[];function preg(e){PNL.push(e);return e}
const chartBox=preg(box('',1290,250,550,390));chartBox.style.cssText+=';background:#fff;border:3px solid #d4ded9;border-radius:24px';
const chT=preg(tx('font:600 28px/1 Inter;color:'+INK,'Loss as the updates repeat',1316,272));
const chS=preg(tx('font:400 23px/1 Inter;color:'+MUT,'conceptual picture · not a measured run',1316,308));
const CX0=1370,CX1=1810,CY0=592,CY1=392,NN=40;
const cs=preg(svg('svg',{width:1920,height:1080,style:'position:absolute;left:0;top:0'},S));
svg('line',{x1:CX0,y1:CY0,x2:CX1,y2:CY0,stroke:MUT,'stroke-width':3},cs);svg('line',{x1:CX0,y1:CY0,x2:CX0,y2:CY1-12,stroke:MUT,'stroke-width':3},cs);
const xl=svg('text',{x:(CX0+CX1)/2,y:CY0+34,'text-anchor':'middle','font-size':24,fill:INK},cs);xl.textContent='updates →';
const yl=svg('text',{x:CX0-14,y:CY1+6,'text-anchor':'end','font-size':24,fill:INK},cs);yl.textContent='loss';
const trainF=n=>0.12+1.7*Math.exp(-n/10);
const valF=n=>0.45+1.55*Math.exp(-n/9)+0.02*Math.max(0,n-16);
const yv=v=>mix(CY0-6,CY1,v/2.0), xv=n=>mix(CX0,CX1-10,n/NN);
const trainP=svg('path',{d:'',fill:'none',stroke:'#26765d','stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round'},cs);
const valP=svg('path',{d:'',fill:'none',stroke:'#b76d66','stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':'1 0'},cs);
const trainDot=svg('circle',{r:11,fill:'#26765d',stroke:'#fff','stroke-width':4},cs);
const valDot=svg('circle',{r:11,fill:'#b76d66',stroke:'#fff','stroke-width':4},cs);
const trLab=preg(tx('font:600 24px/1 Inter;color:#26765d','●&nbsp;training examples',1316,336));
const vaLab=preg(tx('font:600 24px/1 Inter;color:#b76d66','●&nbsp;new cases',1580,336));
function pathUpTo(f,n){let d='';const m=Math.floor(n);for(let k=0;k<=m;k++)d+=(k?'L':'M')+xv(k).toFixed(1)+' '+yv(f(k)).toFixed(1);if(n>m&&m<NN){d+='L'+xv(n).toFixed(1)+' '+yv(f(n)).toFixed(1)}return d}
const goal=preg(el('div','pill b-mint','Goal: useful on <b>new</b> cases'));at(goal,1290,662);goal.style.cssText+=';font-size:30px;padding:14px 26px;width:550px;white-space:nowrap';
// split bar
const spT=preg(tx('font:600 28px/1 Inter;color:'+INK,'Keep data separate',1290,752));
const SEG=[['Training','b-mint','learns from<br>these',.4,'#4d8f7e'],['Validation','b-amber','checks<br>progress',.3,'#ac8b42'],['Test','b-lav','kept for the<br>final check',.3,'#8b75b0']];
const segs=[];{let x=1290;SEG.forEach(([n,cls,cap,fr,col])=>{const w=550*fr;const b=preg(box(cls,x,800,w-6,64));b.style.cssText+=';border-radius:14px;border:3px solid '+col;
  const l=preg(tx('font:700 25px/1 Poppins;color:'+INK+';text-align:center;width:'+(w-6)+'px',n,x,818));const k=preg(tx('font:400 24px/1.25 Inter;color:'+MUT+';text-align:center;width:'+(w-6)+'px',cap,x,880));segs.push([b,l,k]);x+=w})}
// ---------- task table (phase 2)
const TB=[];function treg(e){TB.push(e);return e}
const COL=[[80,370],[470,390],[880,540],[1440,400]];
const HEAD=['Task','Input','Target answer','Loss'];
const heads=HEAD.map((h,i)=>treg(tx('font:700 32px/1 Poppins;color:'+INK,h,COL[i][0]+4,262)));
const hr=treg(box('',80,312,1760,3));hr.style.background='#d4ded9';
const ROWS=[
 ['Photo classifier','a photo','its label, e.g. “cat”','penalty if the label is wrong','b-blue'],
 ['Temperature forecast','today’s measurements','the temperature that actually happened','size of the forecast error','b-blue'],
 ['Protein model<br><span style="font:500 25px Inter;color:#26765d">this lesson</span>','a sequence with one amino acid hidden','the hidden amino acid, taken from the original sequence itself','penalty on the probability the model gives it','b-mint']];
const RY=[332,522,712],RH=172;
const rows=ROWS.map((r,i)=>{const y=RY[i];const bx=treg(box(r[4],80,y,1760,RH));if(i==2)bx.style.cssText+=';border:4px solid #4d8f7e';
  const cells=r.slice(0,4).map((h,j)=>{const t=treg(tx('font:'+(j==0?'700 30px/1.25 Poppins':'500 30px/1.3 Inter')+';color:'+INK+';white-space:normal;display:flex;align-items:center;height:'+RH+'px',(i==2&&j==2)?'<div>the hidden amino acid, taken <span class="hl">from the original sequence itself</span></div>':'<div>'+h+'</div>',COL[j][0]+24,y,COL[j][1]-40));return t});
  return [bx,...cells]});
const hl=document.querySelector('.hl');hl.style.cssText='background:linear-gradient(#a9dcc8,#a9dcc8) no-repeat left center;background-size:0% 100%;border-radius:6px;padding:2px 4px;margin:0 -4px';
const nextPill=treg(el('div','pill b-lav','Next: hide one amino acid and ask the model for its answer  →'));at(nextPill,80,906);nextPill.style.cssText+=';font-size:31px;padding:14px 34px';
return function update(t){
  const K=c;
  // --- model + sliders
  LP.style.transform=`translateX(${(330*(1-out(t,K.c_repeat-.9,1.0))).toFixed(1)}px)`;
  show(mdl.b,t,.3,.6);show(mdl.t,t,.4,.6);show(mdl.s,t,.7,.6);
  // parameter positions
  const first=out(t,K.c_adjust+.4,.9);                 // first real update
  const u=lin(t,K.c_repeat+.4,5.2);                    // repeated updates
  const n=first*1+39*u;
  const settle=1-Math.exp(-n/12);
  const wigEnv=clamp((t-K.c_train)/.4)*clamp((K.c_third-.6-t)/.6);const wig=WB.track(Math.sin((t-K.c_train)*7.5)*wigEnv*.10);
  sl.forEach((s,i)=>{show(s.tr,t,.9+i*.12,.5,{dy:0});show(s.kn,t,.9+i*.12,.5,{dy:0});
    const pos=s.p0+(s.p1-s.p0)*settle+wig*(i%2?-1:1);const pulse=(t>K.c_params&&t<K.c_params+1.4)?1+.35*Math.sin((t-K.c_params)/1.4*Math.PI):1;WB.track(pulse);
    s.kn.style.left=(365+330*pos-14)+'px';s.kn.style.transform=`scale(${pulse})`;});
  show(parLab,t,K.c_params,.6);
  // --- input / target
  show(inp.b,t,K.c_first-.3,.6);show(inp.t,t,K.c_first-.3,.6);show(inpS,t,K.c_first,.6);
  show(tgt.b,t,K.c_first+.9,.6);show(tgt.t,t,K.c_first+.9,.6);show(tgtS,t,K.c_first+1.2,.6);
  // --- prediction / loss / optimizer
  show(prd.b,t,K.c_second-.5,.6);show(prd.t,t,K.c_second-.5,.6);show(prd.s,t,K.c_second-.3,.6);
  show(los.b,t,K.c_second+.9,.6);show(los.t,t,K.c_second+.9,.6);show(losS,t,K.c_loss-.2,.6);show(losN,t,K.c_loss+.2,.6);show(losI,t,K.c_loss+.4,.6);
  show(opt.b,t,K.c_third-.3,.6);show(opt.t,t,K.c_third-.3,.6);show(opt.s,t,K.c_third,.6);
  show(adjLab,t,K.c_adjust,.6,{dy:0});
  // loss number follows the training curve
  losN.innerHTML=trainF(n).toFixed(2);
  // arrows draw in
  const aT=[K.c_first+.3,K.c_second-.7,K.c_second+.3,K.c_second+1.0,K.c_third+.4,K.c_adjust-.2];
  arrows.forEach((a,i)=>{const p=out(t,aT[i],.5);a.style.opacity=p});
  // dots — first walk-through
  dot(0,lin(t,K.c_first+.5,.8));dot(1,lin(t,K.c_second-.6,.8));dot(2,lin(t,K.c_second+.6,.7));dot(3,lin(t,K.c_second+1.1,.7));dot(4,lin(t,K.c_third+.7,.8));dot(5,lin(t,K.c_adjust+.1,.7));
  // repeat phase: dot continues around the loop
  if(t>K.c_repeat){const T=1.3,ph=((t-K.c_repeat)/T)%1;WB.track(ph);const win=(a,b)=>clamp((ph-a)/(b-a));const act=t<K.c_repeat+5.6&&t>K.c_repeat;
    const W=[[0,.12],[.0,.20],[.22,.40],[.40,.55],[.52,.70],[.72,.90]];
    W.forEach(([a,b],i)=>{const p=win(a,b);dot(i,act&&p>0&&p<1?p:0)})}
  show(rep,t,K.c_repeat-.3,.6);show(repT,t,K.c_repeat-.3,.6);show(repI,t,K.c_repeat-.2,.6);show(repN,t,K.c_repeat-.1,.6);
  repN.innerHTML='update '+Math.round(n);
  repI.style.transform=`rotate(${WB.track(Math.floor(clamp((t-K.c_repeat)/5.6)*360*4))}deg)`;
  // --- right panel
  const pIn=K.c_repeat-.4;PNL.forEach(e=>{e.style.opacity=0});
  show(chartBox,t,pIn,.7);show(chT,t,pIn+.1,.6);show(chS,t,pIn+.2,.6);cs.style.opacity=out(t,pIn,.7);
  trainP.setAttribute('d',pathUpTo(trainF,n));const tn=Math.min(n,NN);trainDot.setAttribute('cx',xv(tn));trainDot.setAttribute('cy',yv(trainF(tn)));trainDot.style.opacity=(t>pIn+.5)?1:0;
  show(trLab,t,pIn+.4,.6,{dy:0});
  const vn=NN*lin(t,K.c_memo,3.2);valP.setAttribute('d',pathUpTo(valF,vn));valDot.setAttribute('cx',xv(Math.min(vn,NN)));valDot.setAttribute('cy',yv(valF(Math.min(vn,NN))));valDot.style.opacity=t>K.c_memo?1:0;
  valP.style.opacity=t>K.c_memo?1:0;show(vaLab,t,K.c_memo+.2,.6,{dy:0});
  show(goal,t,K.c_aim,.6);
  show(spT,t,K.c_sep,.6);segs.forEach(([b,l,k],i)=>{show(b,t,K.c_sep+.3+i*.5,.6,{dy:0});show(l,t,K.c_sep+.3+i*.5,.6,{dy:0});show(k,t,K.c_sep+.6+i*.5,.6,{dy:0})});
  // --- hand-off to the task table
  const f=out(t,K.c_task-.1,.7),k=1-f;
  ALL.concat(PNL,[]).forEach(e=>{e.style.opacity=parseFloat(e.style.opacity||1)*k});
  dots.forEach(d=>d.style.opacity=parseFloat(d.style.opacity||0)*k);
  arrows.forEach(a=>a.style.opacity=parseFloat(a.style.opacity||1)*k);
  cs.style.opacity=out(t,pIn,.7)*k;trainDot.style.opacity*=k;valDot.style.opacity*=k;trainP.style.opacity=k;valP.style.opacity=(t>K.c_memo?1:0)*k;
  // table
  TB.forEach(e=>e.style.opacity=0);
  const T0=K.c_task+.3;
  heads.forEach((h,i)=>show(h,t,T0+i*.12,.5));show(hr,t,T0,.5,{dy:0});
  const RT=[T0+.3,T0+2.2,K.c_protein-.2];
  rows.forEach((r,i)=>r.forEach((e,j)=>show(e,t,RT[i]+j*.1,.6,{dy:10})));
  // underline of "from the original sequence itself"
  const uw=out(t,K.c_orig,1.2);hl.style.backgroundSize=(uw*100).toFixed(1)+'% 100%';
  show(nextPill,t,K.c_see-.2,.6);
};
});
</script></body></html>
